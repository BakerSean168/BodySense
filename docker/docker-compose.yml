services:
  # ── Infrastructure ──────────────────────────────────────
  postgres-dev:
    profiles: [dev]
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${DB_USER:-bodysense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bodysense123}
      POSTGRES_DB: ${DB_NAME:-bodysense}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-bodysense} -d ${DB_NAME:-bodysense}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    profiles: [dev]
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6384}:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-bodysense123}
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-bodysense123}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ────────────────────────────────
  api:
    profiles: [dev]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-8080}:8080'
    # ── Go API 只拿它需要的变量 ──
    environment:
      APP_ENV: development
      API_PORT: 8080
      API_HOST: 0.0.0.0
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bodysense}
      DB_USER: ${DB_USER:-bodysense}
      DB_PASSWORD: ${DB_PASSWORD:-bodysense123}
      DB_SSLMODE: disable
      REDIS_HOST: redis-dev
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bodysense123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key}
      JWT_ACCESS_TTL_HOURS: ${JWT_ACCESS_TTL_HOURS:-168}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-720}
      CORS_ORIGINS: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8100
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - bodysense-network

  ai-service:
    profiles: [dev]
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    ports:
      - '${AI_SERVICE_PORT:-8100}:8100'
    # ── Python AI 只拿它需要的变量 ──
    environment:
      AI_SERVICE_PORT: 8100
      DATABASE_URL: postgresql://${DB_USER:-bodysense}:${DB_PASSWORD:-bodysense123}@postgres-dev:5432/${DB_NAME:-bodysense}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b:free}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      ASR_PROVIDER: ${ASR_PROVIDER:-whisper.cpp}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_API_BASE_URL: ${ASR_API_BASE_URL:-}
      ASR_API_MODEL: ${ASR_API_MODEL:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      ASK_USER_ENABLED: ${ASK_USER_ENABLED:-false}
      # Explicit local/CI validation seam. Production leaves this false.
      BODYSENSE_DETERMINISTIC_AI: ${BODYSENSE_DETERMINISTIC_AI:-false}
      BODYSENSE_E2E_STUB_AI: ${BODYSENSE_E2E_STUB_AI:-0}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID:-}
      SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - bodysense-network

  web:
    profiles: [dev]
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-5173}:5173'
    # ── 前端只拿公开配置 ──
    environment:
      VITE_WS_URL: ws://localhost:${WS_PORT:-8080}/ws
      VITE_DEV_API_TARGET: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bodysense-network

networks:
  bodysense-network:
    driver: bridge

volumes:
  postgres-dev-data:
  api-uploads:

services:
  # ── Infrastructure ──────────────────────────────────────
  postgres-dev:
    profiles: [dev]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-bodysense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bodysense123}
      POSTGRES_DB: ${DB_NAME:-bodysense}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-bodysense} -d ${DB_NAME:-bodysense}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    profiles: [dev]
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6384}:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-bodysense123}
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-bodysense123}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ────────────────────────────────
  api:
    profiles: [dev]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-8080}:8080'
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres-dev
      DB_PORT: 5432
      REDIS_HOST: redis-dev
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8100
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - bodysense-network

  ai-service:
    profiles: [dev]
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    ports:
      - '${AI_SERVICE_PORT:-8100}:8100'
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-bodysense}:${DB_PASSWORD:-bodysense123}@postgres-dev:5432/${DB_NAME:-bodysense}
      AI_SERVICE_PORT: 8100
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - bodysense-network

  web:
    profiles: [dev]
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
    networks:
      - bodysense-network

networks:
  bodysense-network:
    driver: bridge

volumes:
  postgres-dev-data:
  api-uploads:

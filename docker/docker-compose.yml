services:
  # ── Infrastructure ──────────────────────────────────────
  postgres-dev:
    profiles: [dev]
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${DB_USER:-bodysense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bodysense123}
      POSTGRES_DB: ${DB_NAME:-bodysense}
    ports:
      - '${DEV_BIND_HOST:-127.0.0.1}:${DB_PORT:-20110}:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-bodysense} -d ${DB_NAME:-bodysense}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    profiles: [dev]
    image: redis:7-alpine
    ports:
      - '${DEV_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-20111}:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-bodysense123}
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-bodysense123}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-gateway:
    profiles: [dev]
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:v1.97.0}
    command: ['--config', '/app/config.yaml', '--port', '4000']
    ports:
      - '${DEV_BIND_HOST:-127.0.0.1}:${LITELLM_PORT:-20112}:4000'
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-bodysense-dev-gateway}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - bodysense-network
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Application Services ────────────────────────────────
  api:
    profiles: [dev]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - '${DEV_BIND_HOST:-127.0.0.1}:${API_PORT:-20101}:8080'
    # ── Go API 只拿它需要的变量 ──
    environment:
      APP_ENV: development
      API_PORT: 8080
      API_HOST: 0.0.0.0
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bodysense}
      DB_USER: ${DB_USER:-bodysense}
      DB_PASSWORD: ${DB_PASSWORD:-bodysense123}
      DB_SSLMODE: disable
      REDIS_HOST: redis-dev
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bodysense123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key}
      JWT_ACCESS_TTL_HOURS: ${JWT_ACCESS_TTL_HOURS:-168}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:20100,http://127.0.0.1:20100}
      AI_SERVICE_URL: http://ai-service:8100
      HEALTH_DOCUMENT_SERVICE_URL: http://document-service:8100
      HEALTH_DOCUMENT_STAGE: ${HEALTH_DOCUMENT_STAGE:-champion}
      HEALTH_DOCUMENT_CHAMPION_CONFIGURATION_ID: ${HEALTH_DOCUMENT_CHAMPION_CONFIGURATION_ID:-hdex-config-14af808ef184bf8b}
      HEALTH_DOCUMENT_QUALIFICATION_CONFIGURATION_ID: ${HEALTH_DOCUMENT_QUALIFICATION_CONFIGURATION_ID:-hdex-config-f2495c95b6ed9de2}
      HEALTH_DOCUMENT_ROLLBACK_CONFIGURATION_ID: ${HEALTH_DOCUMENT_ROLLBACK_CONFIGURATION_ID:-hdex-config-14af808ef184bf8b}

      # 2026-09-01 pre-user baseline promotion: latest qualified configs are
      # the repository Champions; previous v1 configs are explicit rollback targets.
      DIAGNOSIS_CHAMPION_CONFIGURATION_ID: ${DIAGNOSIS_CHAMPION_CONFIGURATION_ID:-diag-config-5a4a13627e14b4cf}
      DIAGNOSIS_CHALLENGER_CONFIGURATION_ID: ${DIAGNOSIS_CHALLENGER_CONFIGURATION_ID:-}
      DIAGNOSIS_ROLLBACK_CONFIGURATION_ID: ${DIAGNOSIS_ROLLBACK_CONFIGURATION_ID:-diag-config-f492eb1c0c6676ae}
      DIAGNOSIS_ROLLOUT_STAGE: ${DIAGNOSIS_ROLLOUT_STAGE:-champion}
      DIAGNOSIS_CANARY_BPS: ${DIAGNOSIS_CANARY_BPS:-1000}
      DIAGNOSIS_ROLLOUT_SALT: ${DIAGNOSIS_ROLLOUT_SALT:-diagnosis-rollout-v1}
      DIAGNOSIS_PROMOTION_RECORD: ${DIAGNOSIS_PROMOTION_RECORD:-}
      TREATMENT_CHAMPION_CONFIGURATION_ID: ${TREATMENT_CHAMPION_CONFIGURATION_ID:-treat-config-f68eec9846664596}
      TREATMENT_CHALLENGER_CONFIGURATION_ID: ${TREATMENT_CHALLENGER_CONFIGURATION_ID:-}
      TREATMENT_ROLLBACK_CONFIGURATION_ID: ${TREATMENT_ROLLBACK_CONFIGURATION_ID:-treat-config-85718f8e90ac9d80}
      TREATMENT_ROLLOUT_STAGE: ${TREATMENT_ROLLOUT_STAGE:-champion}
      TREATMENT_CANARY_BPS: ${TREATMENT_CANARY_BPS:-500}
      TREATMENT_ROLLOUT_SALT: ${TREATMENT_ROLLOUT_SALT:-treatment-rollout-v1}
      TREATMENT_PROMOTION_RECORD: ${TREATMENT_PROMOTION_RECORD:-}
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      document-service:
        condition: service_healthy
    networks:
      - bodysense-network

  document-service:
    profiles: [dev]
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    command: ["uvicorn", "src.document_main:app", "--host", "0.0.0.0", "--port", "8100"]
    init: true
    mem_limit: ${DOCUMENT_SERVICE_MEMORY_LIMIT:-384m}
    mem_reservation: ${DOCUMENT_SERVICE_MEMORY_RESERVATION:-64m}
    ports:
      - '${DEV_BIND_HOST:-127.0.0.1}:${DOCUMENT_SERVICE_PORT:-20103}:8100'
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service:
    profiles: [dev]
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    ports:
      - '${DEV_BIND_HOST:-127.0.0.1}:${AI_SERVICE_PORT:-20102}:8100'
    # ── Python AI 只拿它需要的变量 ──
    environment:
      AI_SERVICE_PORT: 8100
      DATABASE_URL: postgresql://${DB_USER:-bodysense}:${DB_PASSWORD:-bodysense123}@postgres-dev:5432/${DB_NAME:-bodysense}
      LITELLM_BASE_URL: http://litellm-gateway:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-bodysense-dev-gateway}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      ASR_PROVIDER: ${ASR_PROVIDER:-whisper.cpp}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_API_BASE_URL: ${ASR_API_BASE_URL:-}
      ASR_API_MODEL: ${ASR_API_MODEL:-}
      ASK_USER_ENABLED: ${ASK_USER_ENABLED:-false}
      # Explicit local/CI validation seam. Production leaves this false.
      BODYSENSE_DETERMINISTIC_AI: ${BODYSENSE_DETERMINISTIC_AI:-false}
      BODYSENSE_E2E_STUB_AI: ${BODYSENSE_E2E_STUB_AI:-0}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID:-}
      SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres-dev:
        condition: service_healthy
      litellm-gateway:
        condition: service_healthy
    networks:
      - bodysense-network

  web:
    profiles: [dev]
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    ports:
      - '${DEV_BIND_HOST:-127.0.0.1}:${WEB_PORT:-20100}:5173'
    # ── 前端只拿公开配置 ──
    environment:
      VITE_WS_URL: ws://localhost:${API_PORT:-20101}/ws
      VITE_DEV_API_TARGET: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bodysense-network

networks:
  bodysense-network:
    driver: bridge

volumes:
  postgres-dev-data:
  api-uploads:

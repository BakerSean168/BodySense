user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Privacy-bounded structured access log. Query strings, client IPs and
    # referrers are intentionally excluded; request duration and transfer size
    # are retained so large immutable assets (notably anatomy GLBs) can be
    # correlated with browser Resource Timing without logging health content.
    map $http_x_request_id $correlation_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main escape=json '{'
        '"time":"$time_iso8601",'
        '"kind":"http_access",'
        '"request_id":"$correlation_request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time_s":$request_time,'
        '"gzip_ratio":"$gzip_ratio",'
        '"upstream_response_time_s":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml
        model/gltf-binary;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA route fallback — never cache index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # Version-scoped anatomy atlas — byte-verified at image build time.
        # ^~ prevents the SPA fallback from turning a missing GLB/JSON into index.html.
        location ^~ /static/anatomy/vanatome/ {
            types {
                application/json json;
                model/gltf-binary glb;
                text/plain txt;
            }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Request-ID $correlation_request_id always;
        }

        # Static assets — cache 30 days
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable" always;
        }

        # API reverse proxy — Go backend on port 8080
        location /api/ {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # SPA fallback — serve index.html for all unknown routes
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}

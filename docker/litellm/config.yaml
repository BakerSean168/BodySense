model_list:
  # Public logical model group used by BodySense Diagnosis.
  - model_name: bodysense-diagnosis
    litellm_params:
      # MiMo exposes an OpenAI-compatible API; provider-specific placement stays here.
      model: openai/mimo-v2.5-pro
      api_base: os.environ/MIMO_BASE_URL
      api_key: os.environ/MIMO_API_KEY
      timeout: 45

  # Operational fallback group. BodySense application code never requests this name directly.
  - model_name: bodysense-diagnosis-fallback
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45

router_settings:
  num_retries: 1
  retry_after: 1
  fallbacks:
    - bodysense-diagnosis:
        - bodysense-diagnosis-fallback

general_settings:
  # All application traffic must authenticate to the internal gateway.
  master_key: os.environ/LITELLM_MASTER_KEY

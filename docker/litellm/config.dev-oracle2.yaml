# DEV-ONLY isolated LiteLLM topology for the WSL local gateway.
#
# This file is never mounted by production or staging. It is only activated by
# docker/docker-compose.dev-oracle2.yml, which scripts/dev-infra.sh and
# scripts/dev-runtime.sh append when BODYSENSE_LITELLM_DEV_ORACLE2=1.
#
# Physical upstream: Oracle2 gateway (https://oracle.taile92a8e.ts.net:10446/v1).
# Its Virtual Key is read only from ORACLE2_BODYSENSE_API_KEY and is never
# committed; Compose fails closed when the variable is missing.
#
# Intended provider order for compatible NON-VISION logical groups:
#   1. WindHub    windhub-free/glm-5.3            (measured: chat/JSON/tool OK)
#   2. Kunyou     gpt-6-luna                      (PENDING: HTTP503 no channel)
#   3. Nanliang   deepseek-v4.1-flash-1017        (measured: chat/JSON/tool/SSE OK)
#
# The active fallback edge is WindHub -> Nanliang. Kunyou is declared so the
# intended order is reviewable, but it is deliberately NOT wired into
# router_settings.fallbacks until it is qualified: a known-503 upstream must not
# be part of a live request path. Enable it by appending its group name to the
# relevant fallback list after qualification.
#
# No logical group has more than one deployment, and no weight/load-balancing
# settings exist here: routing is deterministic ordered fallback, never random
# load balancing.
model_list:
  # ── Business logical groups (non-vision) ─────────────────
  # Diagnosis: immutable Agent configuration selects this logical group only.
  - model_name: bodysense-diagnosis
    litellm_params:
      model: openai/windhub-free/glm-5.3
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      # WindHub is a slow free channel (chat measured ~42s, JSON ~28s,
      # tool ~27s). The ceiling is deliberately above the measured maximum.
      timeout: 90
  - model_name: bodysense-diagnosis-fallback
    litellm_params:
      model: openai/deepseek-v4.1-flash-1017
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 60

  # General chat/tool use. Application code never names the physical model.
  - model_name: bodysense-consultation
    litellm_params:
      model: openai/windhub-free/glm-5.3
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 90

  # Structured typed-Agent / knowledge JSON generation.
  - model_name: bodysense-structured
    litellm_params:
      model: openai/windhub-free/glm-5.3
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 90

  # General text generation for non-conversation consumers.
  - model_name: bodysense-text
    litellm_params:
      model: openai/windhub-free/glm-5.3
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 90

  # Shared operational fallback for non-vision general groups.
  - model_name: bodysense-general-fallback
    litellm_params:
      model: openai/deepseek-v4.1-flash-1017
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 60

  # ── Vision stays a distinct logical capability group ─────
  # Posture keeps its pre-existing OpenRouter vision configuration: Oracle2 has
  # no qualified vision channel, so posture must not be redirected.
  - model_name: bodysense-posture
    litellm_params:
      model: openrouter/qwen/qwen2.5-vl-72b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60
  - model_name: bodysense-posture-fallback
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-001
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

  # ── Fixed-channel probe groups (no fallback edge) ────────
  # These exist so scripts/dev-oracle2-gateway-eval.py can measure one physical
  # channel deterministically. They are absent from router_settings.fallbacks,
  # so a probe can never be silently answered by a different provider.
  - model_name: bodysense-dev-oracle2-windhub
    litellm_params:
      model: openai/windhub-free/glm-5.3
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 90
  # PENDING: Oracle2 reports HTTP503 "no channel" for gpt-6-luna. Declared for
  # review/measurement only; not a serving group.
  - model_name: bodysense-dev-oracle2-kunyou
    litellm_params:
      model: openai/gpt-6-luna
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 20
  - model_name: bodysense-dev-oracle2-nanliang
    litellm_params:
      model: openai/deepseek-v4.1-flash-1017
      api_base: os.environ/ORACLE2_BODYSENSE_BASE_URL
      api_key: os.environ/ORACLE2_BODYSENSE_API_KEY
      timeout: 60

router_settings:
  # num_retries: 0 disables RETRIES only. It does NOT stop fallbacks: measured
  # on LiteLLM v1.102.1 with a synthetic upstream, ordinary `fallbacks` also
  # fires on 400, 401 and 403, so an authentication or business-validation
  # failure on WindHub is answered by the Nanliang fallback instead of surfacing
  # as an error. That is a known, accepted DEV-ONLY limitation of this file, not
  # a claim of fail-closed auth handling. The eval script therefore measures
  # each channel through the fixed `bodysense-dev-oracle2-*` groups below, which
  # have no fallback edge, so a probe can never be silently answered by another
  # provider. Do not promote this topology to staging/production without a
  # fail-closed auth story.
  num_retries: 0
  retry_after: 1
  # Ordered capability fallback. Deterministic, single edge per group. The
  # intended WindHub -> Kunyou -> Nanliang order is NOT fully wired: Kunyou
  # (gpt-6-luna) answers HTTP503 "no channel" on Oracle2, so it stays pending and
  # out of every live path until it is qualified.
  fallbacks:
    - bodysense-diagnosis:
        - bodysense-diagnosis-fallback
    - bodysense-consultation:
        - bodysense-general-fallback
    - bodysense-structured:
        - bodysense-general-fallback
    - bodysense-text:
        - bodysense-general-fallback
    - bodysense-posture:
        - bodysense-posture-fallback

general_settings:
  # All application LLM traffic authenticates only to this internal gateway.
  master_key: os.environ/LITELLM_MASTER_KEY

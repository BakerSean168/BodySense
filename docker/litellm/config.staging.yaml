model_list:
  # Diagnosis staging temporarily uses a fixed OpenAI-compatible Gemini route
  # to isolate provider/tool-call reliability from the immutable Agent contract.
  # The credential and base URL remain host-only runtime secrets.
  - model_name: bodysense-diagnosis
    litellm_params:
      model: openai/gemini-3.7-flash
      api_base: os.environ/STAGING_DIAGNOSIS_BASE_URL
      api_key: os.environ/STAGING_DIAGNOSIS_API_KEY
      timeout: 45
  - model_name: bodysense-diagnosis-fallback
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45

  # General chat/tool use. Application code never names the physical model.
  - model_name: bodysense-consultation
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      timeout: 45

  # Structured typed-Agent / knowledge JSON generation.
  # Staging uses the same qualified OpenAI-compatible Gemini provider as
  # Diagnosis so PydanticAI tool-output calls do not depend on Groq's
  # provider-specific function-call serialization.
  - model_name: bodysense-structured
    litellm_params:
      model: openai/gemini-3.7-flash
      api_base: os.environ/STAGING_DIAGNOSIS_BASE_URL
      api_key: os.environ/STAGING_DIAGNOSIS_API_KEY
      timeout: 45

  # Small text generation such as conversation titles.
  - model_name: bodysense-text
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      timeout: 45

  # Shared operational fallback for non-vision general groups.
  - model_name: bodysense-general-fallback
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45

  # Vision stays a distinct logical capability group.
  - model_name: bodysense-posture
    litellm_params:
      model: openrouter/qwen/qwen2.5-vl-72b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60
  - model_name: bodysense-posture-fallback
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-001
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

router_settings:
  num_retries: 1
  retry_after: 1
  fallbacks:
    - bodysense-diagnosis:
        - bodysense-diagnosis-fallback
    - bodysense-consultation:
        - bodysense-general-fallback
    - bodysense-structured:
        - bodysense-general-fallback
    - bodysense-text:
        - bodysense-general-fallback
    - bodysense-posture:
        - bodysense-posture-fallback

general_settings:
  # All application LLM traffic authenticates only to this internal gateway.
  master_key: os.environ/LITELLM_MASTER_KEY

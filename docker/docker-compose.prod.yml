# =============================================================================
# BodySense 生产环境 Docker Compose
# =============================================================================
# 启动全部服务：
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.production --env-file .env.production.local up -d
#
# Caddy 反向代理并为 body.bakersean.top 提供 HTTPS。
# systemd deploy watcher 只部署三镜像 revision 一致的 coherent release。
# =============================================================================

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ---------------------------------------------------------------------------
  # 基础设施
  # ---------------------------------------------------------------------------

  postgres:
    logging: *default-logging
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/pgvector:pg18
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-384m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-128m}
    environment:
      POSTGRES_DB: ${DB_NAME:-bodysense}
      POSTGRES_USER: ${DB_USER:-bodysense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production.local}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-prod-data-pg18:/var/lib/postgresql
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-bodysense} -d ${DB_NAME:-bodysense}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    logging: *default-logging
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-16m}
    command:
      - redis-server
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production.local}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-prod-data:/data
    networks:
      - bodysense-network
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
          '--no-auth-warning',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 业务服务（由宿主机 systemd deploy watcher 受控更新）
  # ---------------------------------------------------------------------------

  # Standalone model gateway. ai-service depends on its health before serving requests.
  litellm-gateway:
    logging: *default-logging
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:v1.97.0}
    restart: unless-stopped
    mem_limit: ${LITELLM_MEMORY_LIMIT:-1152m}
    mem_reservation: ${LITELLM_MEMORY_RESERVATION:-640m}
    init: true
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - bodysense-network
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  document-service:
    logging: *default-logging
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/bodysense-ai-service:${AI_TAG:-prod-latest}
    restart: unless-stopped
    mem_limit: ${DOCUMENT_SERVICE_MEMORY_LIMIT:-384m}
    mem_reservation: ${DOCUMENT_SERVICE_MEMORY_RESERVATION:-64m}
    init: true
    command: ["uvicorn", "src.document_main:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - bodysense-network
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ai-service:
    logging: *default-logging
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/bodysense-ai-service:${AI_TAG:-prod-latest}
    restart: unless-stopped
    mem_limit: ${AI_SERVICE_MEMORY_LIMIT:-384m}
    mem_reservation: ${AI_SERVICE_MEMORY_RESERVATION:-160m}
    init: true
    environment:
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8100}
      ENVIRONMENT: production
      LITELLM_BASE_URL: http://litellm-gateway:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${DB_USER:-bodysense}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/${DB_NAME:-bodysense}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      WHISPER_MODEL: ${WHISPER_MODEL:-ggml-base.bin}
      ASK_USER_ENABLED: ${ASK_USER_ENABLED:-false}
      BODYSENSE_DETERMINISTIC_AI: 'false'
      BODYSENSE_E2E_STUB_AI: '0'
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      litellm-gateway:
        condition: service_healthy
    networks:
      - bodysense-network
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    logging: *default-logging
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/bodysense-api:${API_TAG:-prod-latest}
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-192m}
    mem_reservation: ${API_MEMORY_RESERVATION:-48m}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
    environment:
      APP_ENV: production
      GIN_MODE: release
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      API_PORT: 8080
      API_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bodysense}
      DB_USER: ${DB_USER:-bodysense}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      JWT_ACCESS_TTL_HOURS: ${JWT_ACCESS_TTL_HOURS:-0.25}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://115.29.222.2}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      AI_SERVICE_URL: http://ai-service:${AI_SERVICE_PORT:-8100}
      HEALTH_DOCUMENT_SERVICE_URL: http://document-service:8100
      HEALTH_DOCUMENT_STAGE: ${HEALTH_DOCUMENT_STAGE:-champion}
      HEALTH_DOCUMENT_CHAMPION_CONFIGURATION_ID: ${HEALTH_DOCUMENT_CHAMPION_CONFIGURATION_ID:-hdex-config-14af808ef184bf8b}
      HEALTH_DOCUMENT_QUALIFICATION_CONFIGURATION_ID: ${HEALTH_DOCUMENT_QUALIFICATION_CONFIGURATION_ID:-hdex-config-f2495c95b6ed9de2}
      HEALTH_DOCUMENT_ROLLBACK_CONFIGURATION_ID: ${HEALTH_DOCUMENT_ROLLBACK_CONFIGURATION_ID:-hdex-config-14af808ef184bf8b}
      UPLOAD_STORAGE_BACKEND: ${UPLOAD_STORAGE_BACKEND:-local}
      UPLOAD_STORAGE_LOCAL_ROOT: ${UPLOAD_STORAGE_LOCAL_ROOT:-/app/uploads}
      UPLOAD_OSS_REGION: ${UPLOAD_OSS_REGION:-cn-hangzhou}
      UPLOAD_OSS_BUCKET: ${UPLOAD_OSS_BUCKET:-}
      UPLOAD_OSS_ENDPOINT: ${UPLOAD_OSS_ENDPOINT:-}
      UPLOAD_OSS_USE_INTERNAL_ENDPOINT: ${UPLOAD_OSS_USE_INTERNAL_ENDPOINT:-true}
      UPLOAD_OSS_CREDENTIAL_TYPE: ${UPLOAD_OSS_CREDENTIAL_TYPE:-ecs_ram_role}
      UPLOAD_OSS_ECS_RAM_ROLE: ${UPLOAD_OSS_ECS_RAM_ROLE:-}
      UPLOAD_OSS_PREFIX: ${UPLOAD_OSS_PREFIX:-bodysense/production/uploads}
      UPLOAD_OSS_SERVER_SIDE_ENCRYPTION: ${UPLOAD_OSS_SERVER_SIDE_ENCRYPTION:-AES256}

      # 2026-09-01 pre-user baseline promotion: latest qualified configs are
      # the repository Champions; previous v1 configs are explicit rollback targets.
      DIAGNOSIS_CHAMPION_CONFIGURATION_ID: ${DIAGNOSIS_CHAMPION_CONFIGURATION_ID:-diag-config-5a4a13627e14b4cf}
      DIAGNOSIS_CHALLENGER_CONFIGURATION_ID: ${DIAGNOSIS_CHALLENGER_CONFIGURATION_ID:-}
      DIAGNOSIS_ROLLBACK_CONFIGURATION_ID: ${DIAGNOSIS_ROLLBACK_CONFIGURATION_ID:-diag-config-f492eb1c0c6676ae}
      DIAGNOSIS_ROLLOUT_STAGE: ${DIAGNOSIS_ROLLOUT_STAGE:-champion}
      DIAGNOSIS_CANARY_BPS: ${DIAGNOSIS_CANARY_BPS:-1000}
      DIAGNOSIS_ROLLOUT_SALT: ${DIAGNOSIS_ROLLOUT_SALT:-diagnosis-rollout-v1}
      DIAGNOSIS_PROMOTION_RECORD: ${DIAGNOSIS_PROMOTION_RECORD:-}
      TREATMENT_CHAMPION_CONFIGURATION_ID: ${TREATMENT_CHAMPION_CONFIGURATION_ID:-treat-config-f68eec9846664596}
      TREATMENT_CHALLENGER_CONFIGURATION_ID: ${TREATMENT_CHALLENGER_CONFIGURATION_ID:-}
      TREATMENT_ROLLBACK_CONFIGURATION_ID: ${TREATMENT_ROLLBACK_CONFIGURATION_ID:-treat-config-85718f8e90ac9d80}
      TREATMENT_ROLLOUT_STAGE: ${TREATMENT_ROLLOUT_STAGE:-champion}
      TREATMENT_CANARY_BPS: ${TREATMENT_CANARY_BPS:-500}
      TREATMENT_ROLLOUT_SALT: ${TREATMENT_ROLLOUT_SALT:-treatment-rollout-v1}
      TREATMENT_PROMOTION_RECORD: ${TREATMENT_PROMOTION_RECORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - api-uploads:/app/uploads
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-shot disaster-recovery runner. It intentionally uses host networking so
  # it can reach the localhost-bound PostgreSQL service and the ECS metadata
  # endpoint for short-lived RAM-role credentials. It is never started by the
  # normal production service set; systemd invokes it through the `ops` profile.
  dr:
    logging: *default-logging
    profiles: [ops]
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/bodysense-api:${API_TAG:-prod-latest}
    init: true
    network_mode: host
    entrypoint: ['/app/production-dr-manager']
    environment:
      APP_ENV: production
      DB_HOST: 127.0.0.1
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-bodysense}
      DB_USER: ${DB_USER:-bodysense}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DR_OBJECT_STORE_DRIVER: ${DR_OBJECT_STORE_DRIVER:-oss}
      DR_OSS_REGION: ${DR_OSS_REGION:-cn-hangzhou}
      DR_OSS_BUCKET: ${DR_OSS_BUCKET:-}
      DR_OSS_ENDPOINT: ${DR_OSS_ENDPOINT:-}
      DR_OSS_USE_INTERNAL_ENDPOINT: ${DR_OSS_USE_INTERNAL_ENDPOINT:-true}
      DR_OSS_CREDENTIAL_TYPE: ${DR_OSS_CREDENTIAL_TYPE:-ecs_ram_role}
      DR_OSS_ECS_RAM_ROLE: ${DR_OSS_ECS_RAM_ROLE:-}
      DR_OSS_PREFIX: ${DR_OSS_PREFIX:-bodysense/production/postgres}
      DR_OSS_SERVER_SIDE_ENCRYPTION: ${DR_OSS_SERVER_SIDE_ENCRYPTION:-AES256}
      DR_MAX_BACKUP_AGE_HOURS: ${DR_MAX_BACKUP_AGE_HOURS:-30}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      ALIBABA_CLOUD_SECURITY_TOKEN: ${ALIBABA_CLOUD_SECURITY_TOKEN:-}
      DR_DOMAIN_VALIDATOR_PATH: /app/domain-validator
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m

  web:
    logging: *default-logging
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/bodysense-web:${WEB_TAG:-prod-latest}
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-96m}
    mem_reservation: ${WEB_MEMORY_RESERVATION:-16m}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bodysense-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 入口（自动部署由宿主机 systemd watcher 管理）
  # ---------------------------------------------------------------------------

  caddy:
    logging: *default-logging
    image: ${REGISTRY:?set REGISTRY}/${ACR_NAMESPACE:-bodysense}/caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    mem_reservation: ${CADDY_MEMORY_RESERVATION:-32m}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-115.29.222.2}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - bodysense-network

networks:
  bodysense-network:
    driver: bridge

volumes:
  postgres-prod-data-pg18:
    name: ${POSTGRES_DATA_VOLUME:-bodysense-postgres-pg18}
  redis-prod-data:
  api-uploads:
  caddy-data:
  caddy-config:

name: Mirror Production Infrastructure Images

on:
  workflow_dispatch:

concurrency:
  group: production-infra-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror ${{ matrix.name }} to Alibaba ACR
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      REGISTRY: ${{ secrets.ACR_REGISTRY }}
      NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pgvector
            source: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
            target: pgvector:pg18
          - name: redis
            source: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
            target: redis:8.10.2-alpine
          - name: caddy
            source: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
            target: caddy:2-alpine
          - name: litellm
            source: docker.litellm.ai/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
            target: litellm:v1.102.1
    steps:
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Pull pinned linux/amd64 source
        run: docker pull --platform linux/amd64 "${{ matrix.source }}"
      - name: Push pinned mirror
        shell: bash
        run: |
          set -euo pipefail
          target="${REGISTRY}/${NAMESPACE}/${{ matrix.target }}"
          docker tag "${{ matrix.source }}" "$target"
          docker push "$target"
      - name: Summary
        shell: bash
        run: |
          target="${REGISTRY}/${NAMESPACE}/${{ matrix.target }}"
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source: \`${{ matrix.source }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: \`$target\`" >> "$GITHUB_STEP_SUMMARY"

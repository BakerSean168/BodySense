name: CI

on:
  push:
    branches: [main]
  # Run the same manifest-scoped read-only checks against stacked PR targets.
  # Without this, a PR targeting a non-main branch silently has no CI checks.
  # Candidate/release publication remains restricted to successful main push.
  pull_request:
  workflow_dispatch:
  # Nightly full-set safety net: a schedule run checks out main HEAD with
  # base == head, and the manifest generator force-selects every lane for
  # the schedule event, so path-scoped PR selection cannot hide a broken
  # lane for long. Nightly runs are not required checks and never gate a
  # merge; failures surface as a red run plus the Delivery Observation
  # summary artifact, matching the release-health reporting style.
  schedule:
    - cron: "23 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A main push must not cancel an in-flight nightly full run.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  actions: read

env:
  DELIVERY_MANIFEST_PATH: reports/delivery/delivery-manifest-v4.json

jobs:
  scope:
    name: Delivery Scope
    runs-on: ubuntu-latest
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.manifest_digest }}
      risk: ${{ steps.manifest.outputs.risk }}
      lane_governance: ${{ steps.manifest.outputs.lane_governance }}
      lane_web: ${{ steps.manifest.outputs.lane_web }}
      lane_api: ${{ steps.manifest.outputs.lane_api }}
      lane_ai: ${{ steps.manifest.outputs.lane_ai }}
      lane_contracts: ${{ steps.manifest.outputs.lane_contracts }}
      lane_database: ${{ steps.manifest.outputs.lane_database }}
      lane_experience: ${{ steps.manifest.outputs.lane_experience }}
      lane_component: ${{ steps.manifest.outputs.lane_component }}
      lane_full: ${{ steps.manifest.outputs.lane_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - id: manifest
        name: Generate one versioned delivery manifest
        env:
          DELIVERY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          DELIVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/delivery/generate-manifest.mjs
          --event "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --output "$DELIVERY_MANIFEST_PATH"
      - name: Validate manifest self-digest and policy
        run: node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: delivery-manifest-v4
          path: reports/delivery/delivery-manifest-v4.json
          if-no-files-found: error
          retention-days: 14

  governance-child:
    name: Governance child
    needs: scope
    if: needs.scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - run: pnpm install --frozen-lockfile
      - name: Check formatting (Oxfmt, git-managed files)
        run: pnpm format:check
      - name: Check Go formatting (gofmt)
        run: pnpm format:check:go
      - name: Lint with Oxlint
        run: pnpm lint:oxlint
      - name: Lint with Oxlint (type-aware)
        run: pnpm lint:oxlint:types
      - name: Validate delivery policy contracts
        run: node --test scripts/delivery/*.test.mjs
      - name: Validate E2E shard partition completeness
        run: node scripts/e2e/plan-shards.mjs --check --partition apps/web/e2e/shards.json
      - name: Validate V2 active plans and handoff evidence
        run: |
          node scripts/plan/validate-v2-parallel.mjs
          node --test scripts/plan/*.test.mjs
      - name: Validate committed repository diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(jq -r .baseSha "$DELIVERY_MANIFEST_PATH")"
          head_sha="$(jq -r .headSha "$DELIVERY_MANIFEST_PATH")"
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          git diff --check "${base_sha}...${head_sha}"

  quality-web-child:
    name: Web quality child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.lane_web == 'true' &&
      needs.scope.outputs.lane_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Validate manifest digest binding
        run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - name: Execute web quality lane
        run: node scripts/delivery/run-quality.mjs "$DELIVERY_MANIFEST_PATH" --lane web

  quality-api-child:
    name: API quality child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.lane_api == 'true' &&
      needs.scope.outputs.lane_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Validate manifest digest binding
        run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - name: Execute api quality lane
        run: node scripts/delivery/run-quality.mjs "$DELIVERY_MANIFEST_PATH" --lane api

  quality-ai-child:
    name: AI quality child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.lane_ai == 'true' &&
      needs.scope.outputs.lane_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12"
      - run: pnpm install --frozen-lockfile
      - name: Sync Python environment
        working-directory: apps/ai-service
        run: uv sync --frozen --extra dev --extra ocr
      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Validate manifest digest binding
        run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - name: Execute ai quality lane
        run: node scripts/delivery/run-quality.mjs "$DELIVERY_MANIFEST_PATH" --lane ai

  quality-arch-child:
    name: Architecture quality child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_web == 'true' ||
       needs.scope.outputs.lane_api == 'true' ||
       needs.scope.outputs.lane_ai == 'true') &&
      needs.scope.outputs.lane_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Validate manifest digest binding
        run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - name: Execute architecture boundary checks
        run: node scripts/delivery/run-quality.mjs "$DELIVERY_MANIFEST_PATH" --lane arch

  quality-full-child:
    name: Full quality child (validate-repo)
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.lane_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12"
      - run: pnpm install --frozen-lockfile
      - name: Sync Python environment
        working-directory: apps/ai-service
        run: uv sync --frozen --extra dev --extra ocr
      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Validate manifest digest binding
        run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - name: Execute full repository validation
        run: node scripts/delivery/run-quality.mjs "$DELIVERY_MANIFEST_PATH" --lane full

  contracts-child:
    name: Contract verification child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_contracts == 'true' ||
       needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12"
      - run: pnpm install --frozen-lockfile
      - name: Sync Python environment for contract generation
        working-directory: apps/ai-service
        run: uv sync --frozen --extra dev --extra ocr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Validate manifest digest binding
        run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - name: Execute manifest-selected contract verification
        run: node scripts/delivery/run-contracts.mjs "$DELIVERY_MANIFEST_PATH"

  governance-oracle:
    name: Governance Oracle
    needs: [scope, governance-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Verify child outcomes against the delivery manifest
        run: >-
          node scripts/delivery/oracle.mjs
          --manifest "$DELIVERY_MANIFEST_PATH"
          --group governance
          --detector "${{ needs.scope.result }}"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
          --children-json '{"governance":"${{ needs.governance-child.result }}"}'

  quality-oracle:
    name: Quality Oracle
    needs:
      [
        scope,
        quality-web-child,
        quality-api-child,
        quality-ai-child,
        quality-arch-child,
        quality-full-child,
        contracts-child,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Verify child outcomes against the delivery manifest
        run: >-
          node scripts/delivery/oracle.mjs
          --manifest "$DELIVERY_MANIFEST_PATH"
          --group quality
          --detector "${{ needs.scope.result }}"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
          --children-json '{"quality-full":"${{ needs.quality-full-child.result }}","quality-web":"${{ needs.quality-web-child.result }}","quality-api":"${{ needs.quality-api-child.result }}","quality-ai":"${{ needs.quality-ai-child.result }}","quality-arch":"${{ needs.quality-arch-child.result }}","contracts":"${{ needs.contracts-child.result }}"}'

  migrations-child:
    name: PostgreSQL 18 vNext baseline child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: bodysense
          POSTGRES_PASSWORD: bodysense123
          POSTGRES_DB: bodysense_migration_validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodysense -d bodysense_migration_validator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: Validate vNext baseline and latest replay
        working-directory: apps/api
        run: >-
          go run ./cmd/migration-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'
          -migrations 'file://migrations'
      - name: Verify committed baseline schema snapshot
        run: bash scripts/schema/check-snapshot.sh
      - name: Validate longitudinal domain semantics
        working-directory: apps/api
        run: >-
          go run ./cmd/domain-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'

      - name: Verify BodyFact atomic commits and HTTP round trips
        working-directory: apps/api
        env:
          BODYSENSE_INTEGRATION_DATABASE_URL: host=127.0.0.1 user=bodysense password=bodysense123 dbname=bodysense_migration_validator port=5432 sslmode=disable
        run: go test -race ./internal/repository ./internal/service ./internal/transport/httpapi ./internal/consultation -run '^Test(BodyFact|BodyEpisode|ThreadProjection|InteractionResume|SymptomEpisode|Diagnosis|UserAsset|ChatRetention).*Postgres$' -count=1 -v

      - name: Verify independent TrainingPlan decisions on PostgreSQL 18
        working-directory: apps/api
        env:
          BODYSENSE_INTEGRATION_DATABASE_URL: host=127.0.0.1 user=bodysense password=bodysense123 dbname=bodysense_migration_validator port=5432 sslmode=disable
        run: go test -race ./internal/service -run '^TestIndependentTraining.*Postgres$' -count=1 -v

  recovery-migrations-child:
    name: PostgreSQL 18 vNext recovery child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: bodysense
          POSTGRES_PASSWORD: bodysense123
          POSTGRES_DB: bodysense_migration_validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodysense -d bodysense_migration_validator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: Prepare PostgreSQL 18 client toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/pg18-client-bin"
          bash scripts/setup-postgres18-client-wrappers.sh "$RUNNER_TEMP/pg18-client-bin"
          echo "$RUNNER_TEMP/pg18-client-bin" >> "$GITHUB_PATH"
      - name: Validate vNext baseline before recovery drill
        working-directory: apps/api
        run: >-
          go run ./cmd/migration-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'
          -migrations 'file://migrations'
      - name: Validate longitudinal domain semantics after vNext baseline
        working-directory: apps/api
        run: >-
          go run ./cmd/domain-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'
      - name: Validate pg_dump / pg_restore recovery path with PostgreSQL 18 tooling
        working-directory: apps/api
        run: |
          set -euo pipefail
          dump=/tmp/bodysense-vnext-baseline.dump
          restore_db=bodysense_restore_validator
          pg_container="$(docker ps --filter ancestor=pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a --format '{{.ID}}' | head -1)"
          test -n "$pg_container"
          docker exec "$pg_container" pg_dump -U bodysense -d bodysense_migration_validator -Fc > "$dump"
          docker cp "$dump" "$pg_container:/tmp/vnext-baseline.dump" >/dev/null
          docker exec "$pg_container" pg_restore --list /tmp/vnext-baseline.dump >/dev/null
          docker exec "$pg_container" dropdb --if-exists -U bodysense "$restore_db"
          docker exec "$pg_container" createdb -U bodysense "$restore_db"
          docker exec "$pg_container" pg_restore --exit-on-error -U bodysense -d "$restore_db" /tmp/vnext-baseline.dump

          source_version="$(docker exec "$pg_container" psql -U bodysense -d bodysense_migration_validator -Atc 'select version from schema_migrations order by version desc limit 1')"
          restored_version="$(docker exec "$pg_container" psql -U bodysense -d "$restore_db" -Atc 'select version from schema_migrations order by version desc limit 1')"
          test "$source_version" = "$restored_version"

          go run ./cmd/domain-validator \
            -database-url "postgres://bodysense:bodysense123@127.0.0.1:5432/${restore_db}?sslmode=disable"
      - name: Validate production off-host DR algorithm
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: bodysense_migration_validator
          DB_USER: bodysense
          DB_PASSWORD: bodysense123
          DB_SSLMODE: disable
        run: bash scripts/validate-production-dr.sh

  database-oracle:
    name: Database Oracle
    needs: [scope, migrations-child, recovery-migrations-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Verify child outcomes against the delivery manifest
        run: >-
          node scripts/delivery/oracle.mjs
          --manifest "$DELIVERY_MANIFEST_PATH"
          --group database
          --detector "${{ needs.scope.result }}"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
          --children-json '{"database-baseline":"${{ needs.migrations-child.result }}","database-recovery":"${{ needs.recovery-migrations-child.result }}"}'

  e2e-child:
    name: Browser longitudinal health E2E child (shard ${{ matrix.shard }})
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_experience == 'true' || needs.scope.outputs.lane_full == 'true')
    env:
      BODYSENSE_E2E_STUB_AI: "1"
      E2E_BLOB: "1"
    # The shard count must match apps/web/e2e/shards.json: a missing shard
    # fails the merged-report verification in e2e-report-child, and an
    # extra shard fails plan-shards --files-for below.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: bodysense
          POSTGRES_PASSWORD: bodysense123
          POSTGRES_DB: bodysense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodysense -d bodysense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12"
      - run: pnpm install --frozen-lockfile
      - name: Sync Python E2E environment
        working-directory: apps/ai-service
        run: uv sync --frozen --extra ocr
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium (full, on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium (cached browsers, on cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium
      - name: Start Go API
        working-directory: apps/api
        env:
          API_PORT: "8080"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: bodysense
          DB_USER: bodysense
          DB_PASSWORD: bodysense123
          DB_SSLMODE: disable
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: bodysense-ci-e2e-secret
          CORS_ORIGINS: http://127.0.0.1:5173
          AI_SERVICE_URL: http://127.0.0.1:18100
          CONSULTATION_CHAMPION_CONFIGURATION_ID: consult-config-83b6a1cc70477c82
        run: |
          go run ./cmd/server > /tmp/bodysense-api.log 2>&1 &
          echo $! > /tmp/bodysense-api.pid
      - name: Wait for API
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/bodysense-api.log
          exit 1
      - name: Start AI service
        working-directory: apps/ai-service
        env:
          ENVIRONMENT: e2e
          BODYSENSE_DETERMINISTIC_AI: "true"
          DATABASE_URL: postgresql://bodysense:bodysense123@127.0.0.1:5432/bodysense
        run: |
          uv run uvicorn src.main:app --host 127.0.0.1 --port 18100 > /tmp/bodysense-ai.log 2>&1 &
          echo $! > /tmp/bodysense-ai.pid
      - name: Wait for AI service
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18100/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/bodysense-ai.log
          exit 1
      - name: Resolve shard spec files
        id: shard-files
        run: |
          files="$(node scripts/e2e/plan-shards.mjs --files-for ${{ matrix.shard }} --partition apps/web/e2e/shards.json)"
          echo "Shard ${{ matrix.shard }} specs: ${files}"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
      - name: Run browser E2E shard
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE_URL: http://127.0.0.1:8080
          VITE_BODYSENSE_ANATOMY_CATALOG_URL: https://assets.bakersean.top/anatomy/vanatome/1.4.0/releases/1.4.0/catalog.json
        run: pnpm exec playwright test ${{ steps.shard-files.outputs.files }}
      - name: Print service logs on failure
        if: failure()
        run: |
          cat /tmp/bodysense-api.log || true
          cat /tmp/bodysense-ai.log || true
      - name: Upload E2E blob report for this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-blob-shard-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 14

  e2e-report-child:
    name: E2E merged report child
    needs: [scope, e2e-child]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_experience == 'true' || needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download every shard blob report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: e2e-blob-shard-*
          path: blob-reports
          merge-multiple: true
      - name: Merge shard reports
        run: |
          mkdir -p reports/e2e
          pnpm exec playwright merge-reports --reporter html blob-reports
          pnpm exec playwright merge-reports --reporter json blob-reports > reports/e2e/merged-results.json
      - name: Verify merged report covers the whole shard partition
        if: always()
        run: >-
          node scripts/e2e/verify-merged-report.mjs
          --merged reports/e2e/merged-results.json
          --partition apps/web/e2e/shards.json
      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  component-child:
    name: Component browser tests child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_component == 'true' ||
       needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Validate manifest digest binding
        run: >-
          node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium (full, on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium (cached browsers, on cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium
      - name: Run Storybook component browser tests
        run: pnpm nx run @bodysense/web:component-test

  experience-oracle:
    name: Experience Oracle
    needs: [scope, e2e-report-child, component-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Verify child outcomes against the delivery manifest
        run: >-
          node scripts/delivery/oracle.mjs
          --manifest "$DELIVERY_MANIFEST_PATH"
          --group experience
          --detector "${{ needs.scope.result }}"
          --expect-digest "${{ needs.scope.outputs.manifest_digest }}"
          --children-json '{"experience":"${{ needs.e2e-report-child.result }}","component":"${{ needs.component-child.result }}"}'

  delivery-observation:
    name: Delivery Observation
    needs:
      - scope
      - governance-child
      - quality-web-child
      - quality-api-child
      - quality-ai-child
      - quality-arch-child
      - quality-full-child
      - contracts-child
      - component-child
      - migrations-child
      - recovery-migrations-child
      - e2e-child
      - e2e-report-child
      - governance-oracle
      - quality-oracle
      - database-oracle
      - experience-oracle
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: delivery-manifest-v4
          path: reports/delivery
      - name: Materialize execution outcomes
        env:
          QUALITY_RESULTS: >-
            ${{ needs.quality-web-child.result }}
            ${{ needs.quality-api-child.result }}
            ${{ needs.quality-ai-child.result }}
            ${{ needs.quality-arch-child.result }}
            ${{ needs.quality-full-child.result }}
        run: |
          mkdir -p reports/delivery
          quality="skipped"
          for result in $QUALITY_RESULTS; do
            case "$result" in
              failure|cancelled) quality="failure" ;;
              success) if [ "$quality" != "failure" ]; then quality="success"; fi ;;
            esac
          done
          cat > reports/delivery/lane-results.json <<JSON
          {
            "governance": "${{ needs.governance-child.result }}",
            "quality": "${quality}",
            "contracts": "${{ needs.contracts-child.result }}",
            "component": "${{ needs.component-child.result }}",
            "database-baseline": "${{ needs.migrations-child.result }}",
            "database-recovery": "${{ needs.recovery-migrations-child.result }}",
            "experience": "${{ needs.e2e-report-child.result }}"
          }
          JSON
          cat > reports/delivery/oracle-results.json <<'JSON'
          {
            "governance": "${{ needs.governance-oracle.result }}",
            "quality": "${{ needs.quality-oracle.result }}",
            "database": "${{ needs.database-oracle.result }}",
            "experience": "${{ needs.experience-oracle.result }}"
          }
          JSON
      - name: Build versioned delivery observation
        run: >-
          node scripts/delivery/observe-run.mjs
          --manifest "$DELIVERY_MANIFEST_PATH"
          --lanes reports/delivery/lane-results.json
          --oracles reports/delivery/oracle-results.json
          --output reports/delivery/delivery-run-summary-v1.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: delivery-run-summary-${{ github.run_id }}
          path: reports/delivery/delivery-run-summary-v1.json
          if-no-files-found: error
          retention-days: 30

  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint authored PR commits
        run: >-
          bash scripts/quality/lint-commit-range.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

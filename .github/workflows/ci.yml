name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  DELIVERY_MANIFEST_PATH: reports/delivery/delivery-manifest-v1.json

jobs:
  scope:
    name: Delivery Scope
    runs-on: ubuntu-latest
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.manifest_digest }}
      risk: ${{ steps.manifest.outputs.risk }}
      lane_governance: ${{ steps.manifest.outputs.lane_governance }}
      lane_web: ${{ steps.manifest.outputs.lane_web }}
      lane_api: ${{ steps.manifest.outputs.lane_api }}
      lane_ai: ${{ steps.manifest.outputs.lane_ai }}
      lane_contracts: ${{ steps.manifest.outputs.lane_contracts }}
      lane_database: ${{ steps.manifest.outputs.lane_database }}
      lane_experience: ${{ steps.manifest.outputs.lane_experience }}
      lane_full: ${{ steps.manifest.outputs.lane_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - id: manifest
        name: Generate one versioned delivery manifest
        env:
          DELIVERY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DELIVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/delivery/generate-manifest.mjs
          --event "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --output "$DELIVERY_MANIFEST_PATH"
      - name: Validate manifest self-digest and policy
        run: node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-manifest-v1
          path: reports/delivery/delivery-manifest-v1.json
          if-no-files-found: error
          retention-days: 14

  governance-child:
    name: Governance child
    needs: scope
    if: needs.scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: delivery-manifest-v1
          path: reports/delivery
      - run: node scripts/delivery/validate-manifest.mjs "$DELIVERY_MANIFEST_PATH"
      - name: Validate delivery policy contracts
        run: node --test scripts/delivery/*.test.mjs
      - name: Validate repository diff hygiene
        run: git diff --check

  quality-child:
    name: Affected quality child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_web == 'true' ||
       needs.scope.outputs.lane_api == 'true' ||
       needs.scope.outputs.lane_ai == 'true' ||
       needs.scope.outputs.lane_contracts == 'true' ||
       needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: >-
          needs.scope.outputs.lane_api == 'true' ||
          needs.scope.outputs.lane_contracts == 'true' ||
          needs.scope.outputs.lane_full == 'true'
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: >-
          needs.scope.outputs.lane_ai == 'true' ||
          needs.scope.outputs.lane_contracts == 'true' ||
          needs.scope.outputs.lane_full == 'true'
        with:
          version: "0.12"
      - run: pnpm install --frozen-lockfile
      - name: Sync Python environment when selected
        if: >-
          needs.scope.outputs.lane_ai == 'true' ||
          needs.scope.outputs.lane_contracts == 'true' ||
          needs.scope.outputs.lane_full == 'true'
        working-directory: apps/ai-service
        run: uv sync --frozen --extra dev --extra ocr
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: delivery-manifest-v1
          path: reports/delivery
      - name: Execute manifest-selected quality lanes
        run: node scripts/delivery/run-quality.mjs "$DELIVERY_MANIFEST_PATH"

  quality:
    name: Repository quality gate
    needs: [scope, governance-child, quality-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compatibility Oracle for existing protected context
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"governance":true,"quality":${{ (needs.scope.outputs.lane_web == 'true' || needs.scope.outputs.lane_api == 'true' || needs.scope.outputs.lane_ai == 'true' || needs.scope.outputs.lane_contracts == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }}},"children":{"governance":"${{ needs.governance-child.result }}","quality":"${{ needs.quality-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  governance-oracle:
    name: Governance Oracle
    needs: [scope, governance-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"governance":true},"children":{"governance":"${{ needs.governance-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  quality-oracle:
    name: Quality Oracle
    needs: [scope, quality-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"quality":${{ (needs.scope.outputs.lane_web == 'true' || needs.scope.outputs.lane_api == 'true' || needs.scope.outputs.lane_ai == 'true' || needs.scope.outputs.lane_contracts == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }}},"children":{"quality":"${{ needs.quality-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  migrations-child:
    name: PostgreSQL 18 current-history child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bodysense
          POSTGRES_PASSWORD: bodysense123
          POSTGRES_DB: bodysense_migration_validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodysense -d bodysense_migration_validator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: Validate current history through published baseline and latest replay
        working-directory: apps/api
        run: >-
          go run ./cmd/migration-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'
          -migrations 'file://migrations'
          -baseline-version 29
      - name: Validate longitudinal domain semantics
        working-directory: apps/api
        run: >-
          go run ./cmd/domain-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'

  migrations:
    name: PostgreSQL 18 current-history replay
    needs: [scope, migrations-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"database-current":${{ (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }}},"children":{"database-current":"${{ needs.migrations-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  production-migrations-child:
    name: PostgreSQL 18 production-baseline child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bodysense
          POSTGRES_PASSWORD: bodysense123
          POSTGRES_DB: bodysense_migration_validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodysense -d bodysense_migration_validator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: Prepare PostgreSQL 18 client toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/pg18-client-bin"
          bash scripts/setup-postgres18-client-wrappers.sh "$RUNNER_TEMP/pg18-client-bin"
          echo "$RUNNER_TEMP/pg18-client-bin" >> "$GITHUB_PATH"
      - name: Restore schema-only production v29 baseline
        working-directory: apps/api
        env:
          PGPASSWORD: bodysense123
        run: >-
          psql -v ON_ERROR_STOP=1
          -h 127.0.0.1 -p 5432 -U bodysense -d bodysense_migration_validator
          -f migrations/baselines/production-v29.sql
      - name: Validate production baseline upgrade and latest replay
        working-directory: apps/api
        run: >-
          go run ./cmd/migration-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'
          -migrations 'file://migrations'
          -baseline-version 29
      - name: Validate longitudinal domain semantics after production upgrade
        working-directory: apps/api
        run: >-
          go run ./cmd/domain-validator
          -database-url 'postgres://bodysense:bodysense123@127.0.0.1:5432/bodysense_migration_validator?sslmode=disable'
      - name: Validate durable upload storage migration semantics
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: bodysense
          DB_PASSWORD: bodysense123
        run: bash scripts/validate-upload-storage-migration.sh
      - name: Validate pg_dump / pg_restore recovery path with PostgreSQL 18 tooling
        working-directory: apps/api
        run: |
          set -euo pipefail
          dump=/tmp/bodysense-production-upgrade.dump
          restore_db=bodysense_restore_validator
          pg_container="$(docker ps --filter ancestor=pgvector/pgvector:pg18 --format '{{.ID}}' | head -1)"
          test -n "$pg_container"
          docker exec "$pg_container" pg_dump -U bodysense -d bodysense_migration_validator -Fc > "$dump"
          docker cp "$dump" "$pg_container:/tmp/upgrade.dump" >/dev/null
          docker exec "$pg_container" pg_restore --list /tmp/upgrade.dump >/dev/null
          docker exec "$pg_container" dropdb --if-exists -U bodysense "$restore_db"
          docker exec "$pg_container" createdb -U bodysense "$restore_db"
          docker exec "$pg_container" pg_restore --exit-on-error -U bodysense -d "$restore_db" /tmp/upgrade.dump

          source_version="$(docker exec "$pg_container" psql -U bodysense -d bodysense_migration_validator -Atc 'select version from schema_migrations order by version desc limit 1')"
          restored_version="$(docker exec "$pg_container" psql -U bodysense -d "$restore_db" -Atc 'select version from schema_migrations order by version desc limit 1')"
          test "$source_version" = "$restored_version"

          go run ./cmd/domain-validator \
            -database-url "postgres://bodysense:bodysense123@127.0.0.1:5432/${restore_db}?sslmode=disable"
      - name: Validate production off-host DR algorithm
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: bodysense_migration_validator
          DB_USER: bodysense
          DB_PASSWORD: bodysense123
          DB_SSLMODE: disable
        run: bash scripts/validate-production-dr.sh

  production-migrations:
    name: PostgreSQL 18 production-baseline upgrade
    needs: [scope, production-migrations-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"database-production":${{ (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }}},"children":{"database-production":"${{ needs.production-migrations-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  database-oracle:
    name: Database Oracle
    needs: [scope, migrations-child, production-migrations-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"database-current":${{ (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }},"database-production":${{ (needs.scope.outputs.lane_database == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }}},"children":{"database-current":"${{ needs.migrations-child.result }}","database-production":"${{ needs.production-migrations-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  e2e-child:
    name: Browser longitudinal health E2E child
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      (needs.scope.outputs.lane_experience == 'true' || needs.scope.outputs.lane_full == 'true')
    env:
      BODYSENSE_E2E_STUB_AI: "1"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bodysense
          POSTGRES_PASSWORD: bodysense123
          POSTGRES_DB: bodysense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodysense -d bodysense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12"
      - run: pnpm install --frozen-lockfile
      - name: Sync Python E2E environment
        working-directory: apps/ai-service
        run: uv sync --frozen --extra ocr
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start Go API
        working-directory: apps/api
        env:
          API_PORT: "8080"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: bodysense
          DB_USER: bodysense
          DB_PASSWORD: bodysense123
          DB_SSLMODE: disable
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: bodysense-ci-e2e-secret
          CORS_ORIGINS: http://127.0.0.1:5173
          AI_SERVICE_URL: http://127.0.0.1:18100
        run: |
          go run ./cmd/server > /tmp/bodysense-api.log 2>&1 &
          echo $! > /tmp/bodysense-api.pid
      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/bodysense-api.log
          exit 1
      - name: Start AI service
        working-directory: apps/ai-service
        env:
          ENVIRONMENT: e2e
          BODYSENSE_DETERMINISTIC_AI: "true"
          DATABASE_URL: postgresql://bodysense:bodysense123@127.0.0.1:5432/bodysense
        run: |
          uv run uvicorn src.main:app --host 127.0.0.1 --port 18100 > /tmp/bodysense-ai.log 2>&1 &
          echo $! > /tmp/bodysense-ai.pid
      - name: Wait for AI service
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18100/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/bodysense-ai.log
          exit 1
      - name: Run browser E2E
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE_URL: http://127.0.0.1:8080
          VITE_BODYSENSE_ANATOMY_CATALOG_URL: https://assets.bakersean.top/anatomy/vanatome/1.4.0/releases/1.4.0/catalog.json
        run: pnpm e2e
      - name: Print service logs on failure
        if: failure()
        run: |
          cat /tmp/bodysense-api.log || true
          cat /tmp/bodysense-ai.log || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  e2e:
    name: Browser longitudinal health E2E
    needs: [scope, e2e-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"experience":${{ (needs.scope.outputs.lane_experience == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }}},"children":{"experience":"${{ needs.e2e-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  experience-oracle:
    name: Experience Oracle
    needs: [scope, e2e-child]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope.result }}","enabled":{"experience":${{ (needs.scope.outputs.lane_experience == 'true' || needs.scope.outputs.lane_full == 'true') && 'true' || 'false' }}},"children":{"experience":"${{ needs.e2e-child.result }}"}}
        run: node scripts/delivery/oracle.mjs

  delivery-observation:
    name: Delivery Observation
    needs:
      - scope
      - governance-child
      - quality-child
      - migrations-child
      - production-migrations-child
      - e2e-child
      - governance-oracle
      - quality-oracle
      - database-oracle
      - experience-oracle
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: delivery-manifest-v1
          path: reports/delivery
      - name: Materialize execution outcomes
        run: |
          mkdir -p reports/delivery
          cat > reports/delivery/lane-results.json <<'JSON'
          {
            "governance": "${{ needs.governance-child.result }}",
            "quality": "${{ needs.quality-child.result }}",
            "database-current": "${{ needs.migrations-child.result }}",
            "database-production": "${{ needs.production-migrations-child.result }}",
            "experience": "${{ needs.e2e-child.result }}"
          }
          JSON
          cat > reports/delivery/oracle-results.json <<'JSON'
          {
            "governance": "${{ needs.governance-oracle.result }}",
            "quality": "${{ needs.quality-oracle.result }}",
            "database": "${{ needs.database-oracle.result }}",
            "experience": "${{ needs.experience-oracle.result }}"
          }
          JSON
      - name: Build versioned delivery observation
        run: >-
          node scripts/delivery/observe-run.mjs
          --manifest "$DELIVERY_MANIFEST_PATH"
          --lanes reports/delivery/lane-results.json
          --oracles reports/delivery/oracle-results.json
          --output reports/delivery/delivery-run-summary-v1.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-run-summary-${{ github.run_id }}
          path: reports/delivery/delivery-run-summary-v1.json
          if-no-files-found: error
          retention-days: 30

  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

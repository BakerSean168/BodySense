name: Dev Containers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainers.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainers.yml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: devcontainers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dev Container (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [lite, full]
    env:
      PROFILE: ${{ matrix.profile }}
      TASK_LABEL: io.baker.devcontainer-acceptance=${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned Dev Containers CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/devcontainer-cli" --no-save --no-package-lock @devcontainers/cli@0.90.0
          echo "DEVCONTAINER_CLI=$RUNNER_TEMP/devcontainer-cli/node_modules/.bin/devcontainer" >> "$GITHUB_ENV"
          echo "VALIDATION_DIR=$RUNNER_TEMP/devcontainer-validation" >> "$GITHUB_ENV"
          config=.devcontainer/devcontainer.json
          if [[ "$PROFILE" == full ]]; then config=.devcontainer/full/devcontainer.json; fi
          echo "PROFILE_CONFIG=$GITHUB_WORKSPACE/$config" >> "$GITHUB_ENV"
      - name: Build and start the original profile
        run: |
          mkdir -p "$VALIDATION_DIR"
          "$DEVCONTAINER_CLI" up \
            --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$PROFILE_CONFIG" \
            --id-label "$TASK_LABEL" \
            --no-lockfile \
            --include-merged-configuration \
            --log-level info \
            > "$VALIDATION_DIR/up.json" 2> "$VALIDATION_DIR/up.log"
          jq -e '.outcome == "success" and .remoteUser == "vscode"' "$VALIDATION_DIR/up.json"
          node --input-type=module - "$PROFILE_CONFIG" "$VALIDATION_DIR/up.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const receipt = JSON.parse(readFileSync(process.argv[3], 'utf8'));
          const ports = (value) => value.map(String).sort();
          assert.deepEqual(ports(receipt.mergedConfiguration.forwardPorts), ports(config.forwardPorts));
          NODE
      - name: Verify tools and running services as the development user
        run: |
          container_id="$(jq -er '.containerId' "$VALIDATION_DIR/up.json")"
          "$DEVCONTAINER_CLI" exec \
            --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$PROFILE_CONFIG" \
            --container-id "$container_id" \
            --id-label "$TASK_LABEL" \
            bash .devcontainer/verify.sh "$PROFILE" \
            > "$VALIDATION_DIR/checks.log" 2>&1
          cat "$VALIDATION_DIR/checks.log"
          test -z "$(git status --porcelain)"
      - name: Remove this job's containers and volumes
        if: always()
        run: |
          while read -r container_id; do
            [[ -n "$container_id" ]] || continue
            mapfile -t volumes < <(docker inspect "$container_id" --format '{{json .Mounts}}' | jq -r '.[] | select(.Type == "volume") | .Name')
            docker stop --timeout 10 "$container_id"
            docker rm -v "$container_id"
            for volume in "${volumes[@]}"; do
              if [[ -z "$(docker ps -aq --filter "volume=$volume")" ]]; then docker volume rm "$volume"; fi
            done
          done < <(docker ps -aq --filter "label=$TASK_LABEL")
      - name: Keep bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: devcontainer-${{ matrix.profile }}-validation
          path: ${{ runner.temp }}/devcontainer-validation/
          if-no-files-found: ignore
          retention-days: 7

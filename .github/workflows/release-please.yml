name: Prepare Release

# Release preparation is an explicit product milestone. Normal main integration
# and staging delivery do not implicitly create/update a release PR.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # BODYSENSE_WORKFLOW allows the generated Release PR to trigger normal
          # protected-branch CI. release-please is configured to prepare version
          # files/CHANGELOG only; Release Publish owns tag/GitHub Release creation.
          token: ${{ secrets.BODYSENSE_WORKFLOW || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

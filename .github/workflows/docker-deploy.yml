name: Build & Publish Production Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Immutable image tag override (manual runs only)"
        required: false
        type: string
      promote:
        description: "Also promote this manual candidate to prod-latest"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-image-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    name: Verify tested release revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require successful CI for the exact revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == workflow_dispatch && "$PROMOTE" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual production promotion is allowed only from main.' >&2
            exit 1
          fi

          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$REVISION" origin/main; then
            echo "Revision $REVISION is not reachable from main; refusing production publication." >&2
            exit 1
          fi

          response="$(curl --fail-with-body -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${REVISION}&event=push&status=completed&per_page=100")"

          if ! jq -e --arg sha "$REVISION" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' \
            <<<"$response" >/dev/null; then
            echo "No successful completed CI push run exists for revision $REVISION." >&2
            exit 1
          fi

          echo "Verified successful CI for exact revision $REVISION." >> "$GITHUB_STEP_SUMMARY"

  metadata:
    needs: verify-ci
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.meta.outputs.revision }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          stamp="$(date -u +%Y%m%d-%H%M%S)"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag_override }}" ]]; then
            tag="${{ inputs.tag_override }}"
            [[ "$tag" != v* ]] || { echo "manual runs may not overwrite immutable release tags" >&2; exit 1; }
          else
            tag="manual-${stamp}-${short_sha}"
          fi

          [[ "$tag" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "invalid image tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "### Production candidate: \`$tag\` @ \`${short_sha}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.service }} immutable image
    needs: metadata
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      REGISTRY: ${{ secrets.ACR_REGISTRY }}
      NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            image: bodysense-web
            context: .
            dockerfile: docker/Dockerfile.web
            cache_scope: web
          - service: api
            image: bodysense-api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            cache_scope: api
          - service: ai-service
            image: bodysense-ai-service
            context: apps/ai-service
            dockerfile: apps/ai-service/Dockerfile
            cache_scope: ai-service
          - service: runtime
            image: bodysense-runtime
            context: .
            dockerfile: docker/Dockerfile.runtime
            cache_scope: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ needs.metadata.outputs.tag }}
          build-args: |
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
            VCS_REF=${{ needs.metadata.outputs.revision }}
            VERSION=${{ needs.metadata.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  promote:
    name: Promote coherent production pointers
    needs: [metadata, build]
    environment:
      name: production
      url: https://body.bakersean.top
    env:
      REGISTRY: ${{ secrets.ACR_REGISTRY }}
      NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    if: github.ref_type == 'tag' || inputs.promote == true
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Promote immutable images to prod-latest
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          for image in bodysense-runtime bodysense-web bodysense-api bodysense-ai-service; do
            src="${REGISTRY}/${NAMESPACE}/${image}:${tag}"
            dst="${REGISTRY}/${NAMESPACE}/${image}:prod-latest"
            docker buildx imagetools create --tag "$dst" "$src"
          done
      - name: Summary
        run: |
          {
            echo '### Production image promotion complete'
            echo ''
            echo '- Immutable tag: `${{ needs.metadata.outputs.tag }}`'
            echo '- Revision: `${{ needs.metadata.outputs.revision }}`'
            echo '- `prod-latest` was promoted only after all four immutable artifacts succeeded.'
            echo '- The production watcher deploys only when Web, API, AI and runtime image revision labels match.'
          } >> "$GITHUB_STEP_SUMMARY"

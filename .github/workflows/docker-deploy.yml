name: Legacy Build Production Images (manual fallback)

# Delivery Platform V3 publishes exact-SHA candidates after main CI and Release
# Publish promotes those verified digests. This workflow is retained temporarily
# as a manual build fallback only; it cannot create v* releases or move prod-latest.
on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Immutable non-release image tag override"
        required: false
        type: string

concurrency:
  group: production-image-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    name: Verify tested release revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require successful CI for the exact revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail


          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$REVISION" origin/main; then
            echo "Revision $REVISION is not reachable from main; refusing production publication." >&2
            exit 1
          fi

          response="$(curl --fail-with-body -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${REVISION}&event=push&status=completed&per_page=100")"

          if ! jq -e --arg sha "$REVISION" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' \
            <<<"$response" >/dev/null; then
            echo "No successful completed CI push run exists for revision $REVISION." >&2
            exit 1
          fi

          echo "Verified successful CI for exact revision $REVISION." >> "$GITHUB_STEP_SUMMARY"

  metadata:
    needs: verify-ci
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.meta.outputs.revision }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          stamp="$(date -u +%Y%m%d-%H%M%S)"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag_override }}" ]]; then
            tag="${{ inputs.tag_override }}"
            [[ "$tag" != v* ]] || { echo "manual runs may not overwrite immutable release tags" >&2; exit 1; }
          else
            tag="manual-${stamp}-${short_sha}"
          fi

          [[ "$tag" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "invalid image tag: $tag" >&2; exit 1; }
          {
            echo "tag=$tag"
            echo "revision=$revision"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
          echo "### Production candidate: \`$tag\` @ \`${short_sha}\`" >> "$GITHUB_STEP_SUMMARY"

  static-assets:
    name: Publish immutable public assets
    needs: metadata
    runs-on: ubuntu-latest
    environment:
      name: production
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      asset_base: ${{ steps.config.outputs.asset_base }}
      atlas_catalog_url: ${{ steps.config.outputs.atlas_catalog_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: config
        name: Resolve public asset configuration
        shell: bash
        env:
          STATIC_ASSET_CDN_BASE: ${{ vars.STATIC_ASSET_CDN_BASE }}
          REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          root="${STATIC_ASSET_CDN_BASE%/}"
          if [[ -z "$root" ]]; then
            {
              echo 'enabled=false'
              echo 'asset_base='
              echo 'atlas_catalog_url='
            } >> "$GITHUB_OUTPUT"
            echo 'Static asset CDN is not configured; Web will retain same-origin assets.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$root" == https://* ]] || { echo 'STATIC_ASSET_CDN_BASE must use https://' >&2; exit 1; }
          {
            echo 'enabled=true'
            echo "asset_base=${root}/web/${REVISION}/"
            echo "atlas_catalog_url=${root}/anatomy/vanatome/1.4.0/releases/1.4.0/catalog.json"
          } >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install release tooling
        if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Acquire and publish pinned anatomy atlas
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          STATIC_ASSET_CDN_BASE: ${{ vars.STATIC_ASSET_CDN_BASE }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vanatome-1.4.0"
          node scripts/anatomy/sync.mjs --version 1.4.0 --output "$root"
          node scripts/anatomy/verify.mjs --version 1.4.0 --root "$root"
          node scripts/static-assets/publish-atlas-r2.mjs \
            --version 1.4.0 \
            --root "$root" \
            --public-base "$STATIC_ASSET_CDN_BASE"
      - name: Build and publish revision-scoped Vite assets
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          REVISION: ${{ needs.metadata.outputs.revision }}
          VITE_ASSET_BASE: ${{ steps.config.outputs.asset_base }}
          VITE_BODYSENSE_ANATOMY_CATALOG_URL: ${{ steps.config.outputs.atlas_catalog_url }}
          STATIC_ASSET_CDN_BASE: ${{ vars.STATIC_ASSET_CDN_BASE }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          rm -rf apps/web/dist
          pnpm --dir apps/web exec vite build
          node scripts/static-assets/manifest.mjs \
            --dist apps/web/dist \
            --revision "$REVISION" \
            --base-url "$VITE_ASSET_BASE"
          node scripts/static-assets/publish-web-r2.mjs \
            --dist apps/web/dist \
            --public-base "$STATIC_ASSET_CDN_BASE"
          echo "Published immutable Web assets at $VITE_ASSET_BASE" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.service }} immutable image
    needs: [metadata, static-assets]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      REGISTRY: ${{ secrets.ACR_REGISTRY }}
      NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            image: bodysense-web
            context: .
            dockerfile: docker/Dockerfile.web
            cache_scope: web
          - service: api
            image: bodysense-api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            cache_scope: api
          - service: ai-service
            image: bodysense-ai-service
            context: apps/ai-service
            dockerfile: apps/ai-service/Dockerfile
            cache_scope: ai-service
          - service: runtime
            image: bodysense-runtime
            context: .
            dockerfile: docker/Dockerfile.runtime
            cache_scope: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ needs.metadata.outputs.tag }}
          build-args: |
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
            VCS_REF=${{ needs.metadata.outputs.revision }}
            VERSION=${{ needs.metadata.outputs.tag }}
            VITE_ASSET_BASE=${{ needs.static-assets.outputs.asset_base }}
            VITE_BODYSENSE_ANATOMY_CATALOG_URL=${{ needs.static-assets.outputs.atlas_catalog_url }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  verify-static-coherence:
    name: Verify Web image ↔ CDN coherence
    needs: [metadata, static-assets, build]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      REGISTRY: ${{ secrets.ACR_REGISTRY }}
      NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    steps:
      - name: Skip when public asset CDN is disabled
        if: needs.static-assets.outputs.enabled != 'true'
        run: echo 'Static asset CDN disabled; same-origin Web image requires no CDN coherence gate.'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        if: needs.static-assets.outputs.enabled == 'true'
      - name: Login to Alibaba Cloud ACR
        if: needs.static-assets.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Verify every image asset exists at the revision CDN prefix
        if: needs.static-assets.outputs.enabled == 'true'
        shell: bash
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          ASSET_BASE: ${{ needs.static-assets.outputs.asset_base }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${NAMESPACE}/bodysense-web:${TAG}"
          docker pull "$image" >/dev/null
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$RUNNER_TEMP/bodysense-web-root"' EXIT
          mkdir -p "$RUNNER_TEMP/bodysense-web-root"
          docker cp "$container:/usr/share/nginx/html/." "$RUNNER_TEMP/bodysense-web-root/"
          grep -Fq "$ASSET_BASE" "$RUNNER_TEMP/bodysense-web-root/index.html" || {
            echo "Web image index.html does not reference expected CDN base: $ASSET_BASE" >&2
            exit 1
          }
          failures=0
          extracted_root="$RUNNER_TEMP/bodysense-web-root/"
          while IFS= read -r -d '' file; do
            relative="${file#"$extracted_root"}"
            url="${ASSET_BASE}${relative}"
            if ! curl --fail --silent --show-error --head --location "$url" >/dev/null; then
              echo "missing CDN asset: $url" >&2
              failures=$((failures + 1))
            fi
          done < <(find "$RUNNER_TEMP/bodysense-web-root/assets" -type f -print0)
          (( failures == 0 )) || exit 1
          echo 'Web image and public immutable asset prefix are coherent.' >> "$GITHUB_STEP_SUMMARY"

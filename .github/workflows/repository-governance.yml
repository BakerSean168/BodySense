name: Repository Production Governance

on:
  workflow_dispatch:
    inputs:
      sync_acr_secrets:
        description: Copy current repository ACR secrets into the production Environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: repository-production-governance
  cancel-in-progress: false

jobs:
  apply:
    name: Apply repository production governance
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BODYSENSE_WORKFLOW }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require repository-admin PAT
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'BODYSENSE_WORKFLOW is required.' >&2; exit 1; }
          admin="$(gh api "repos/${REPOSITORY}" --jq '.permissions.admin')"
          [[ "$admin" == true ]] || { echo 'BODYSENSE_WORKFLOW does not have repository admin permission.' >&2; exit 1; }

      - name: Protect main branch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/main-protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "Repository quality gate",
                "PostgreSQL 18 current-history replay",
                "PostgreSQL 16 production-v29 upgrade",
                "Browser longitudinal health E2E",
                "commit-lint"
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON
          gh api --method PUT "repos/${REPOSITORY}/branches/main/protection" \
            --input /tmp/main-protection.json >/dev/null

      - name: Configure production environment
        id: production-environment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/production-environment.json <<'JSON'
          {
            "wait_timer": 0,
            "prevent_self_review": false,
            "reviewers": [],
            "deployment_branch_policy": {
              "protected_branches": false,
              "custom_branch_policies": true
            }
          }
          JSON
          gh api --method PUT "repos/${REPOSITORY}/environments/production" \
            --input /tmp/production-environment.json >/dev/null

          existing="$(gh api "repos/${REPOSITORY}/environments/production/deployment-branch-policies" --paginate)"
          if ! jq -e '.branch_policies[]? | select(.name == "main" and .type == "branch")' <<<"$existing" >/dev/null; then
            gh api --method POST "repos/${REPOSITORY}/environments/production/deployment-branch-policies" \
              -f name='main' -f type='branch' >/dev/null
          fi
          if ! jq -e '.branch_policies[]? | select(.name == "v*" and .type == "tag")' <<<"$existing" >/dev/null; then
            gh api --method POST "repos/${REPOSITORY}/environments/production/deployment-branch-policies" \
              -f name='v*' -f type='tag' >/dev/null
          fi

      - name: Copy ACR credentials into production environment
        if: inputs.sync_acr_secrets == true && steps.production-environment.outcome == 'success'
        shell: bash
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "$key repository secret is missing." >&2; exit 1; }
            printf '%s' "${!key}" | gh secret set "$key" --env production --repo "$REPOSITORY"
          done

      - name: Governance summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Repository production governance'
            echo '- `main` requires PR flow and all five CI checks, including commit lint.'
            echo '- Administrators are subject to branch protection.'
            echo '- Force pushes and branch deletion are disabled.'
            if [[ '${{ steps.production-environment.outcome }}' == success ]]; then
              echo '- `production` Environment policy reconciled successfully.'
            else
              echo '- ⚠️ `production` Environment policy was not changed because the PAT lacks Environment administration permission.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

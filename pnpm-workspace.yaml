packages:
  - packages/*
  - apps/web
allowBuilds:
  "@apollo/protobufjs": false
  esbuild: true
  nx: true
minimumReleaseAgeExclude:
  - typescript@7.0.2
  - typescript7@7.0.2
  - "@assistant-ui/core@0.3.0 || 0.3.1"
  - "@assistant-ui/store@0.3.0 || 0.3.1"
  - "@assistant-ui/tap@0.9.7"
  - assistant-cloud@0.1.37
  - assistant-stream@0.3.29 || 0.3.30
  - react-router@8.3.0
  - safe-content-frame@0.0.25
nodeLinker: hoisted

overrides:
  # Keep the assistant-ui 0.15.17 runtime on its coherent release family.
  # Its broad internal caret ranges otherwise mix newer core packages with
  # assistant-cloud 0.1.x, which is not export-compatible.
  "@assistant-ui/core": "0.3.16"
  "@assistant-ui/store": "0.3.11"
  "@assistant-ui/tap": "0.9.15"
  "assistant-cloud": "0.1.42"
  "assistant-stream": "0.3.40"
  "safe-content-frame": "0.0.28"
  "nanoid@5.1.15": "5.1.16"
  # Vite 8.3.0's bundled-dev browser client embeds the Rolldown 1.2.6
  # experimental runtime. Newer 1.2.x bundlers emit requestLazy(), which that
  # client runtime does not provide, yielding a blank page on dynamic imports.
  # Keep them aligned until Vite ships a matching bundled-dev runtime.
  "rolldown": "1.2.6"

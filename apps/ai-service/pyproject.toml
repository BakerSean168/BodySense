[project]
name = "bodysense-ai"
version = "0.1.0"
description = "BodySense AI Service - posture analysis and RAG"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "openai==3.19.2",
    "psycopg[binary,pool]>=3.3.6",
    "pgvector>=0.5.0",
    "redis>=8.1.0",
    "python-dotenv>=1.2.3",
    "Pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "langgraph>=1.2.12",
    "pyyaml>=6.0.3",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pydantic-ai-slim[openai]==2.50.0",
    "pydantic-evals==2.50.0",
    "protovalidate>=1.0.0",
    "protobuf>=7.36.2",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
    "PyMuPDF==1.28.0",
]
ml = [
    "sentence-transformers>=5.6.1",
]
pose = [
    # MediaPipe 1.x Tasks API (solutions API removed in 1.0).
    "mediapipe==1.0.0",
    "numpy>=2.5.3",
]
dev = [
    "ruff>=0.16.9",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
]
document-ocr = [
    "onnxruntime==1.29.0",
    "rapidocr==3.9.2",
]
ocr-benchmark = [
    "onnxruntime==1.29.0",
    "rapidocr==3.9.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["src/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

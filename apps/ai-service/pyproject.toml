[project]
name = "bodysense-ai"
version = "0.1.0"
description = "BodySense AI Service - posture analysis and RAG"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.34.0",
    "openai>=1.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.4.0",
    "redis>=5.2.0",
    "python-dotenv>=1.1.0",
    "Pillow>=11.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
    "PyMuPDF>=1.25.0",
    "opencv-python-headless>=4.10.0",
]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

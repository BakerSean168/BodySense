name: assessment_evidence_contract_v4
cases:
  - name: profile-is-not-health-evidence
    inputs:
      profile:
        gender: male
        birth_date: "1996-08-27"
      selections: []
    metadata:
      expected_issue_count: 0
      expected_coverage_status: insufficient
      expected_available_domains: []
      expected_rendered_descriptions: []

  - name: confirmed-exercise-renders-source-only
    inputs:
      body_state:
        facts:
          - kind: lifestyle.exercise
            value: "健身；频率：1-2"
            review_state: confirmed
            lifecycle_state: active
      selections:
        - kind: exercise_pattern
          evidence_refs: [body_state:fact:0]
    metadata:
      expected_issue_count: 0
      expected_coverage_status: partial
      expected_available_domains: [exercise]
      expected_rendered_descriptions: ["来源记录：健身；频率：1-2。"]

  - name: unverified-body-state-is-unavailable
    inputs:
      body_state:
        facts:
          - kind: lifestyle.exercise
            value: "健身；频率：1-2"
            review_state: unverified
            lifecycle_state: active
            excluded_from_reasoning: true
      selections:
        - kind: exercise_pattern
          evidence_refs: [body_state:fact:0]
    metadata:
      expected_issue_count: 1
      expected_issue_fragments: [references unavailable evidence]
      expected_coverage_status: insufficient
      expected_available_domains: []
      expected_rendered_descriptions: []

  - name: posture-cannot-borrow-lifestyle-evidence
    inputs:
      body_state:
        facts:
          - kind: lifestyle.activity
            value: 久坐为主
            review_state: confirmed
            lifecycle_state: active
      selections:
        - kind: posture_alignment
          evidence_refs: [body_state:fact:0]
    metadata:
      expected_issue_count: 1
      expected_issue_fragments: [cannot use body_state evidence]
      expected_coverage_status: partial
      expected_available_domains: [lifestyle]
      expected_rendered_descriptions: []

  - name: same-evidence-cannot-be-selected-twice
    inputs:
      body_state:
        facts:
          - kind: lifestyle.exercise
            value: 跑步
            review_state: confirmed
            lifecycle_state: active
      selections:
        - kind: exercise_pattern
          evidence_refs: [body_state:fact:0]
        - kind: exercise_pattern
          evidence_refs: [body_state:fact:0]
    metadata:
      expected_issue_count: 1
      expected_issue_fragments: [selected more than once]
      expected_coverage_status: partial
      expected_available_domains: [exercise]
      expected_rendered_descriptions: []

  - name: posture-finding-renders-governed-evidence
    inputs:
      posture_analysis:
        has_analysis: true
        views:
          - view: front
            analysis:
              findings:
                - key: uneven_shoulders
                  label: 肩部对称性待复核
                  evidence: 右侧肩峰位置略高
      selections:
        - kind: posture_asymmetry
          evidence_refs: [posture:view:0:finding:0]
    metadata:
      expected_issue_count: 0
      expected_coverage_status: partial
      expected_available_domains: [posture]
      expected_rendered_descriptions: ["体态分析记录：右侧肩峰位置略高。"]

  - name: health-report-is-not-injury-evidence
    inputs:
      report_indicators:
        - value:
            name: 25-OH-D
            value: "12.5"
            unit: ng/mL
            confidence: high
            evidence_admissibility:
              status: admissible
              policy_revision: ocr-indicator-admissibility-v1
              reason_codes: [high_confidence_ocr_and_indicator]
      selections:
        - kind: report_indicator
          evidence_refs: [report:0]
    metadata:
      expected_issue_count: 0
      expected_coverage_status: partial
      expected_available_domains: [health_report]
      expected_rendered_descriptions: ["报告记录：25-OH-D=12.5 ng/mL。"]

  - name: body-state-kind-must-match-observation-kind
    inputs:
      body_state:
        facts:
          - kind: lifestyle.sleep
            value: 规律
            review_state: confirmed
            lifecycle_state: active
      selections:
        - kind: exercise_pattern
          evidence_refs: [body_state:fact:0]
    metadata:
      expected_issue_count: 1
      expected_issue_fragments: [is not supported by BodyState kind]
      expected_coverage_status: partial
      expected_available_domains: [lifestyle]
      expected_rendered_descriptions: []

  - name: review-required-report-is-unavailable
    inputs:
      report_indicators:
        - value:
            name: 25-OH-D
            value: "12.5"
            unit: ng/mL
            confidence: medium
            evidence_admissibility:
              status: needs_review
              policy_revision: ocr-indicator-admissibility-v1
              reason_codes: [indicator_confidence_medium]
      selections:
        - kind: report_indicator
          evidence_refs: [report:0]
    metadata:
      expected_issue_count: 1
      expected_issue_fragments: [references unavailable evidence]
      expected_coverage_status: insufficient
      expected_available_domains: []
      expected_rendered_descriptions: []

  - name: confirmed-review-promotes-review-required-indicator
    inputs:
      reviewed_report_evidence:
        - upload_id: 22222222-2222-2222-2222-222222222222
          indicator_index: 0
          indicator_id: 25-oh-d
          extraction_run_id: 33333333-3333-3333-3333-333333333333
          review_id: 44444444-4444-4444-4444-444444444444
          reviewer_user_id: 77777777-7777-7777-7777-777777777777
          source_refs: [src:a]
          page_ref:
            src:a:
              page_number: 1
              bbox: [0, 0, 1, 1]
          action: confirm
          reviewed: true
          value:
            indicator_id: 25-oh-d
            name: 25-OH-D
            value: "12.5"
            unit: ng/mL
      selections:
        - kind: report_indicator
          evidence_refs: [report:upload:22222222-2222-2222-2222-222222222222:indicator:0]
    metadata:
      expected_issue_count: 0
      expected_coverage_status: partial
      expected_available_domains: [health_report]
      expected_rendered_descriptions: ["报告记录：25-OH-D=12.5 ng/mL。"]

  - name: corrected-review-renders-reviewed-value
    inputs:
      reviewed_report_evidence:
        - upload_id: 22222222-2222-2222-2222-222222222222
          indicator_index: 1
          indicator_id: ferritin
          extraction_run_id: 33333333-3333-3333-3333-333333333333
          review_id: 55555555-5555-5555-5555-555555555555
          reviewer_user_id: 77777777-7777-7777-7777-777777777777
          source_refs: [src:a]
          page_ref:
            src:a:
              page_number: 1
              bbox: [0, 0, 1, 1]
          action: correct
          reviewed: true
          value:
            indicator_id: ferritin
            name: Ferritin
            value: "50.0"
            unit: ng/mL
      selections:
        - kind: report_indicator
          evidence_refs: [report:upload:22222222-2222-2222-2222-222222222222:indicator:1]
    metadata:
      expected_issue_count: 0
      expected_coverage_status: partial
      expected_available_domains: [health_report]
      expected_rendered_descriptions: ["报告记录：Ferritin=50.0 ng/mL。"]

  - name: reviewed-evidence-without-provenance-fails-closed
    inputs:
      reviewed_report_evidence:
        - upload_id: 22222222-2222-2222-2222-222222222222
          indicator_index: 0
          indicator_id: 25-oh-d
          action: confirm
          value:
            indicator_id: 25-oh-d
            name: 25-OH-D
            value: "12.5"
            unit: ng/mL
        - upload_id: 22222222-2222-2222-2222-222222222222
          indicator_index: 1
          indicator_id: ferritin
          extraction_run_id: 33333333-3333-3333-3333-333333333333
          review_id: 66666666-6666-6666-6666-666666666666
          reviewer_user_id: 77777777-7777-7777-7777-777777777777
          source_refs: [src:a]
          page_ref:
            src:a:
              page_number: 1
              bbox: [0, 0, 1, 1]
          action: reject
          reviewed: true
          value:
            indicator_id: ferritin
            name: Ferritin
            value: "50.0"
            unit: ng/mL
      selections:
        - kind: report_indicator
          evidence_refs: [report:upload:22222222-2222-2222-2222-222222222222:indicator:0]
        - kind: report_indicator
          evidence_refs: [report:upload:22222222-2222-2222-2222-222222222222:indicator:1]
    metadata:
      expected_issue_count: 2
      expected_issue_fragments: [references unavailable evidence]
      expected_coverage_status: insufficient
      expected_available_domains: []
      expected_rendered_descriptions: []

  - name: reviewed-evidence-without-source-provenance-fails-closed
    inputs:
      reviewed_report_evidence:
        - upload_id: 22222222-2222-2222-2222-222222222222
          indicator_index: 2
          indicator_id: glucose
          extraction_run_id: 33333333-3333-3333-3333-333333333333
          review_id: 88888888-8888-8888-8888-888888888888
          reviewer_user_id: 77777777-7777-7777-7777-777777777777
          action: confirm
          reviewed: true
          source_refs: []
          page_ref: {}
          value:
            indicator_id: glucose
            name: Glucose
            value: "5.2"
            unit: mmol/L
      selections:
        - kind: report_indicator
          evidence_refs: [report:upload:22222222-2222-2222-2222-222222222222:indicator:2]
    metadata:
      expected_issue_count: 1
      expected_issue_fragments: [references unavailable evidence]
      expected_coverage_status: insufficient
      expected_available_domains: []
      expected_rendered_descriptions: []

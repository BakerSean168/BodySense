name: treatment_qualification_v2
cases:
  - name: adopted-neck-condition
    inputs:
      user_id: eval-treatment-adopted
      body_state_revision: 21
      body_state:
        current_revision: 21
        facts:
          - id: fact-neck
            kind: discomfort
            concern_key: "region:neck"
            body_region: 颈肩
            value: 久坐后酸胀
      diagnosis:
        currentRevision: 3
        conditionEntries:
          - conditionId: condition-neck
            medicalName: 久坐相关颈肩负荷模式
            assessment: {level: likely}
            disposition: adopted
    metadata:
      split: development
      slices: [adopted, proposal-only]

  - name: suspected-condition-remains-reviewable
    inputs:
      user_id: eval-treatment-suspected
      body_state_revision: 22
      body_state:
        current_revision: 22
        facts:
          - id: fact-neck-suspected
            kind: discomfort
            concern_key: "region:neck"
            body_region: 颈肩
            value: 活动后轻度不适
      diagnosis:
        currentRevision: 1
        conditionEntries:
          - conditionId: condition-suspected
            medicalName: 颈肩负荷模式
            assessment: {level: suspected}
            disposition: adopted
    metadata:
      split: holdout
      slices: [suspected, human-review]
      required_context_tokens: [suspected]

  - name: user-constraint-is-in-run-context
    inputs:
      user_id: eval-treatment-constraint
      body_state_revision: 23
      body_state:
        current_revision: 23
        facts:
          - id: fact-back
            kind: discomfort
            concern_key: "region:back"
            body_region: 腰背
            value: 久坐僵硬
      diagnosis:
        currentRevision: 2
        conditionEntries:
          - conditionId: condition-back
            medicalName: 久坐相关腰背负荷模式
            assessment: {level: likely}
            disposition: adopted
      user_constraints:
        equipment: none
        avoid_floor_exercises: true
    metadata:
      split: regression
      slices: [user-constraint, context-pinning]
      required_context_tokens: [avoid_floor_exercises]

  - name: existing-evidence-is-pinned
    inputs:
      user_id: eval-treatment-evidence
      body_state_revision: 24
      body_state:
        current_revision: 24
        facts:
          - id: fact-shoulder
            kind: discomfort
            concern_key: "region:shoulder"
            body_region: 肩部
            value: 抬臂后疲劳
      diagnosis:
        currentRevision: 4
        conditionEntries:
          - conditionId: condition-shoulder
            medicalName: 肩部负荷耐受模式
            assessment: {level: likely}
            disposition: adopted
      evidence:
        - evidence_id: evidence-shoulder-1
          condition_id: condition-shoulder
          title: 肩部渐进负荷原则
          summary: 低风险渐进活动并根据症状调整
    metadata:
      split: challenge
      slices: [evidence-context, challenge]
      required_context_tokens: [evidence-shoulder-1]

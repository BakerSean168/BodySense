name: diagnosis_evidence_policy_v2
cases:
  - name: no-gap-no-search
    inputs:
      gaps: []
      max_searches: 2
      search_results: {}
    metadata:
      expected_search_calls: 0
      expected_stop_reasons: []
      expected_used_searches: 0
      expected_unresolved_critical_gap_ids: []
      expected_external_evidence_status: not_required

  - name: user-fact-never-rag
    inputs:
      gaps:
        - gap_id: user-trigger
          kind: user_fact
          description: 需要用户说明具体诱发动作
          rationale: 用户自身经历只能由用户或 BodyState 提供
          critical: true
      max_searches: 2
      search_results: {}
    metadata:
      expected_search_calls: 0
      expected_stop_reasons: [user_input_required]
      expected_used_searches: 0
      expected_unresolved_critical_gap_ids: [user-trigger]
      expected_external_evidence_status: not_required

  - name: external-gap-sufficient-result
    inputs:
      gaps:
        - gap_id: mechanism
          kind: external_knowledge
          description: 需要核对候选机制的外部证据
          rationale: 该证据会改变候选支持强度
          query: targeted mechanism evidence
      max_searches: 2
      search_results:
        targeted mechanism evidence:
          - evidence_id: evidence-mechanism
            content: targeted result
            relation_to_hypothesis: supports
    metadata:
      expected_search_calls: 1
      expected_stop_reasons: [evidence_returned]
      expected_used_searches: 1
      expected_unresolved_critical_gap_ids: []
      expected_external_evidence_status: available
      expected_returned_evidence_relations: [supports]

  - name: external-gap-contradictory-result
    inputs:
      gaps:
        - gap_id: contradiction
          kind: external_knowledge
          description: 需要检查反向证据
          rationale: 反向证据会降低候选支持强度
          query: contradictory evidence
      max_searches: 2
      search_results:
        contradictory evidence:
          - evidence_id: evidence-contradiction
            content: evidence contradicts the candidate
            relation_to_hypothesis: contradicts
    metadata:
      expected_search_calls: 1
      expected_stop_reasons: [evidence_returned]
      expected_used_searches: 1
      expected_unresolved_critical_gap_ids: []
      expected_external_evidence_status: available
      expected_returned_evidence_relations: [contradicts]

  - name: external-gap-empty-published-corpus
    inputs:
      gaps:
        - gap_id: empty-corpus
          kind: external_knowledge
          description: 需要外部证据但当前发布语料为空
          rationale: 不能把空语料伪装成无证据需求
          query: empty corpus query
      max_searches: 2
      search_results: {}
      search_outcomes:
        empty corpus query: published_corpus_empty
    metadata:
      expected_search_calls: 1
      expected_stop_reasons: [published_corpus_empty]
      expected_used_searches: 1
      expected_unresolved_critical_gap_ids: []
      expected_external_evidence_status: unresolved

  - name: external-gap-search-unavailable
    inputs:
      gaps:
        - gap_id: unavailable
          kind: external_knowledge
          description: 需要外部证据但检索后端不可用
          rationale: 检索故障必须显式降级
          query: unavailable query
      max_searches: 2
      search_results: {}
      search_outcomes:
        unavailable query: search_unavailable
    metadata:
      expected_search_calls: 1
      expected_stop_reasons: [search_unavailable]
      expected_used_searches: 1
      expected_unresolved_critical_gap_ids: []
      expected_external_evidence_status: unresolved

  - name: external-gap-irrelevant-results
    inputs:
      gaps:
        - gap_id: irrelevant
          kind: external_knowledge
          description: 发布语料存在但没有相关证据
          rationale: 无相关结果不能伪装成语料为空
          query: irrelevant query
      max_searches: 2
      search_results: {}
    metadata:
      expected_search_calls: 1
      expected_stop_reasons: [no_relevant_results]
      expected_used_searches: 1
      expected_unresolved_critical_gap_ids: []
      expected_external_evidence_status: unresolved

  - name: critical-gap-zero-budget
    inputs:
      gaps:
        - gap_id: critical-zero-budget
          kind: external_knowledge
          description: 缺少关键外部依据
          rationale: 没有该证据不能安全提高候选确定性
          critical: true
          query: critical missing evidence
      max_searches: 0
      search_results: {}
    metadata:
      expected_search_calls: 0
      expected_stop_reasons: [budget_exhausted]
      expected_used_searches: 0
      expected_unresolved_critical_gap_ids: [critical-zero-budget]
      expected_external_evidence_status: unresolved

  - name: second-critical-gap-stops-at-budget
    inputs:
      gaps:
        - gap_id: first
          kind: external_knowledge
          description: 第一项外部证据
          rationale: 可能改变候选支持强度
          query: first evidence query
        - gap_id: second-critical
          kind: external_knowledge
          description: 第二项关键外部证据
          rationale: 该关键证据决定是否应维持当前候选
          critical: true
          query: second evidence query
      max_searches: 1
      search_results:
        first evidence query:
          - evidence_id: evidence-first
            content: first result
            relation_to_hypothesis: supports
        second evidence query:
          - evidence_id: evidence-second
            content: second result
            relation_to_hypothesis: supports
    metadata:
      expected_search_calls: 1
      expected_stop_reasons: [evidence_returned, budget_exhausted]
      expected_used_searches: 1
      expected_unresolved_critical_gap_ids: [second-critical]
      expected_external_evidence_status: partially_available
      expected_returned_evidence_relations: [supports]

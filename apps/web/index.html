<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BodySense - AI Posture Health Assistant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Boot recovery. When any request of the entry module graph is dropped
      // (a network change, or a deploy that replaced the chunks) the browser
      // fires "error" on the module script and the app never mounts. Reload
      // once instead of leaving a blank page; a second failure within a
      // minute stays visible so a real outage cannot loop.
      (function () {
        var key = "bodysense:boot-reload-at";
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (!(el instanceof HTMLScriptElement) || el.type !== "module") {
              return;
            }
            try {
              var last = Number(window.sessionStorage.getItem(key) || 0);
              if (Date.now() - last < 60000) return;
              window.sessionStorage.setItem(key, String(Date.now()));
            } catch (_) {
              return;
            }
            window.location.reload();
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

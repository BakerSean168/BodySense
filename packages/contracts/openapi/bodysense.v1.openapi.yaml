          description: Standard exercise concept ids (or stable custom ids); non-empty only for exercise scope.
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        lift_policy:
          type: string
          enum: [on_expiry, user_reverification, professional_clearance]
        lift_conditions:
          description: Explicit conditions from a reviewed Go policy, never model-authored. Reverification requires every condition affirmed through the exact bound AskUser answer.
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1

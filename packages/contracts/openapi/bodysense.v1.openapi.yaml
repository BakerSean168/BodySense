openapi: 3.1.0
info:
  title: BodySense Public API
  version: 1.0.0-vnext
  license:
    name: MIT
    identifier: MIT
  description: Canonical browser-facing REST contract for BodySense vNext. During Phase 02 endpoints are added only when their
    production handler is migrated behind the generated boundary; undocumented legacy routes remain temporary debt until this
    specification reaches complete public-route coverage.
servers:
- url: /
paths:
  /api/v1/body-state/facts:
    post:
      operationId: addBodyStateFact
      summary: Add a durable BodyState fact with optimistic revision checking.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBodyStateFactRequest'
      responses:
        '200':
          description: Fact and immutable revision created by the mutation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health-workspace:
    get:
      operationId: getHealthWorkspace
      summary: Get the current longitudinal health workspace projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current workspace projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthWorkspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/body-state:
    get:
      operationId: getBodyState
      summary: Get the current durable BodyState snapshot.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/body-state/facts/{id}/correct:
    post:
      operationId: correctBodyStateFact
      summary: Correct a fact that was previously wrong.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectBodyStateFactRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /api/v1/body-state/facts/{id}/temporal:
    patch:
      operationId: updateBodyStateFactTemporal
      summary: Update temporal state for a previously true fact.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBodyStateFactTemporalRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/facts/{id}/review:
    patch:
      operationId: reviewBodyStateFact
      summary: Review a BodyState fact.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBodyStateFactRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/observations:
    post:
      operationId: addBodyStateObservation
      summary: Add a durable BodyState observation.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateObservationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyStateObservationInput'
  /api/v1/body-state/observations/{id}/review:
    patch:
      operationId: reviewBodyStateObservation
      summary: Review a BodyState observation.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateObservationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBodyStateObservationRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/hypotheses:
    post:
      operationId: addBodyStateHypothesis
      summary: Add a BodyState hypothesis.
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateHypothesisMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyStateHypothesisInput'
  /api/v1/body-state/hypotheses/{id}/lifecycle:
    patch:
      operationId: updateBodyStateHypothesisLifecycle
      summary: Update hypothesis lifecycle/counterevidence.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateHypothesisMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBodyStateHypothesisLifecycleRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/evidence:
    get:
      operationId: listBodyStateEvidence
      summary: List durable evidence references used by BodyState reasoning.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateEvidenceListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/body-state/safety/resolve:
    post:
      operationId: resolveBodyStateSafety
      summary: Resolve or monitor the durable safety projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateRevisionMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveBodyStateSafetyRequest'
  /api/v1/lifestyle:
    get:
      operationId: getLifestyle
      summary: Get the current lifestyle projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifestyleSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateLifestyle
      summary: Patch the current lifestyle projection with optimistic concurrency.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifestyleSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLifestyleRequest'
  /api/v1/lifestyle/candidates/{id}/accept:
    post:
      operationId: acceptLifestyleCandidate
      summary: Accept an AI-extracted lifestyle candidate.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifestyleSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewLifestyleCandidateRequest'
      parameters: &id002
      - name: id
        in: path
        required: true
        schema: &id010
          type: string
          format: uuid
  /api/v1/lifestyle/candidates/{id}/reject:
    post:
      operationId: rejectLifestyleCandidate
      summary: Reject an AI-extracted lifestyle candidate.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifestyleSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewLifestyleCandidateRequest'
      parameters: *id002
  /api/v1/body-metrics:
    get:
      operationId: getBodyMetrics
      summary: Get current anthropometric measurements.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateBodyMetrics
      summary: Update current anthropometric measurements with optimistic concurrency.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricsSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBodyMetricsRequest'
  /api/v1/health-history/injury:
    get:
      operationId: getInjuryHistory
      summary: Get the current injury-history projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjuryHistorySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateInjuryHistory
      summary: Update injury-history summary with optimistic concurrency.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjuryHistorySnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInjuryHistoryRequest'
  /api/v1/onboarding/context:
    put:
      operationId: submitOnboardingContext
      summary: Atomically establish stable profile identity and the initial BodyState context.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingContextResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingContextRequest'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user identity.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Authenticated user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile:
    get:
      operationId: getUserProfile
      summary: Get stable user identity profile.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Profile, or null before onboarding/profile creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableUserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateUserProfile
      summary: Replace the editable stable identity fields.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Updated stable identity profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/privacy/erasure-plan:
    get:
      operationId: getPrivacyErasurePlan
      summary: Preview the durable data-erasure scope without mutating user data.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current destructive erasure plan.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyErasurePlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/privacy/erasure:
    post:
      operationId: requestPrivacyErasure
      summary: Accept an irreversible full-account and health-data erasure request.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyErasureRequest'
      responses:
        '202':
          description: Erasure request is durable and may continue after disconnect.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: Clears the browser refresh credential immediately after durable acceptance.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyErasureAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/client-diagnostics:
    post:
      operationId: recordClientDiagnostic
      summary: Record bounded privacy-safe browser operational telemetry.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientDiagnostic'
      responses:
        '204':
          description: Diagnostic accepted for operational logging.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assessment/generate:
    post:
      operationId: generateAssessment
      summary: Generate and durably persist an evidence-grounded assessment report.
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Assessment report created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentReportV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/assessment:
    get:
      operationId: listAssessments
      summary: List immutable assessment reports for the authenticated user.
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Paginated assessment reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/assessment/{id}:
    get:
      operationId: getAssessment
      summary: Get one immutable assessment report.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AssessmentReportId'
      responses:
        '200':
          description: Assessment report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/assessment/{id}/replay:
    post:
      operationId: replayAssessment
      summary: Replay an immutable assessment historically or counterfactually without mutating durable state.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AssessmentReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentReplayRequest'
      responses:
        '200':
          description: Transient replay comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentReplayReport'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/assessment/{id}/regression-export:
    get:
      operationId: exportAssessmentRegressionCase
      summary: Export a read-only frozen assessment regression case.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AssessmentReportId'
      responses:
        '200':
          description: Assessment qualification regression case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentRegressionExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      operationId: registerAccount
      summary: Register a new account and establish a browser session family.
      security: []
      requestBody:
        required: true

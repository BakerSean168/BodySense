  /api/v1/diagnosis/analysis-runs:
    get:
      operationId: listNativeDiagnosisRuns
      summary: Recover the authenticated user's formal analysis runs in immutable start order.
      description: >
        Owner-scoped keyset page. Terminal status is derived from append-only
        audit events and settlement receipts; no read creates or adopts a diagnosis.
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      - name: beforeRunId
        in: query
        required: false
        description: Opaque owner-owned prior run ID cursor for descending keyset pagination.
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Bounded formal run recovery index.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeDiagnosisRunPage'}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
    post:
      operationId: startNativeDiagnosisRun
      summary: Start a formal Diagnosis analysis from the authenticated user's own request statement.
      description: >
        Go freezes the BodyState/Safety input, applies Go Safety and decision policy,
        runs the Diagnosis Agent and persists its output only as pending proposals on a
        new formal run. A proposal is never a ConditionEntry; adoption still requires the
        user's explicit decisions and whole-run settlement. Retrying an idempotencyKey
        replays the original run (200) without re-running the Agent; malformed, foreign
        or stale Agent output is rejected without any partial write.

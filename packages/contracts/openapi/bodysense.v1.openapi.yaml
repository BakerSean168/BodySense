      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeDiagnosisRunStartRequest'}
      responses:
        '201':
          description: New formal run with its pending proposals or terminal no-proposal outcome.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeDiagnosisRunProjection'}
        '200':
          description: Idempotent replay of the run already started with this key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeDiagnosisRunProjection'}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

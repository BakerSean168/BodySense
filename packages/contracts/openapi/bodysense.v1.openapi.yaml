          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/{id}/extractions/{runId}/source:
    get:
      operationId: getHealthDocumentSource
      summary: Stream the authenticated private source document for one exact owned extraction run.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Private upload bytes. The server preserves the stored MIME type and adds nosniff.
          content:
            application/pdf:
              schema: &privateUploadBinary
                type: string
                format: binary
            image/jpeg:
              schema: *privateUploadBinary
            image/png:
              schema: *privateUploadBinary
            image/webp:
              schema: *privateUploadBinary
            application/octet-stream:
              schema: *privateUploadBinary
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

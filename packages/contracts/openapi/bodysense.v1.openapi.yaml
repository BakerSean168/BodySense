        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/treatments/revisions/{revisionId}/replay:
    post:
      operationId: replayTreatmentRevision
      summary: Replay an immutable Treatment revision historically or counterfactually.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TreatmentRevisionId'
      requestBody:
        required: true
        content:
          application/json:

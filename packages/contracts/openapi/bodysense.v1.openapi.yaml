openapi: 3.1.0
info:
  title: BodySense Public API
  version: 1.0.0-vnext
  license:
    name: MIT
    identifier: MIT
  description: Canonical browser-facing REST contract for BodySense vNext. Public handlers and browser clients use this generated boundary as the single runtime contract.
servers:
- url: /
paths:
  /api/v1/body-state/records:
    post:
      operationId: recordBodyFacts
      summary: Atomically record explicit direct-user statements and return the original durable commit receipt on retry.
      description: New approved assertion ledger. Authenticated owner and direct-edit provenance are assigned server-side. This does not accept diagnoses, arbitrary source identities, training-log bindings or correction authorization.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBodyFactsRequest"
      responses:
        "200":
          description: Committed batch receipt; not a claim that downstream outbox delivery completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyFactCommit"
        "400": &a1
          $ref: "#/components/responses/InvalidRequest"
        "401": &a2
          $ref: "#/components/responses/Unauthorized"
        "409": &a3
          $ref: "#/components/responses/RevisionConflict"
        "500": &a4
          $ref: "#/components/responses/InternalError"
        "503": &a5
          $ref: "#/components/responses/ValidationUnavailable"
    get:
      operationId: listBodyFactRecords
      summary: Read bounded, whole-revision pages from the new assertion ledger.
      description: This projection contains migrated/new BodyFact records only, not the still-unconverted legacy BodyState snapshot. Sources blocked from new use are excluded.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: before_revision
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: At most twenty complete semantic batches, with a cursor for older batches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyFactRecordPage"
        "400": *a1
        "401": *a2
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/observation-records:
    post:
      operationId: recordBodyObservation
      summary: Store one explicit user-reported observation without claiming device or clinical verification.
      description: Authenticated direct edit only. Raw value and original unit are never normalized or interpreted as a diagnosis. Provenance, source version, revision and receipt are assigned server-side; no legacy observation dual write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBodyObservationRequest"
      responses:
        "200":
          description: Durable source-backed observation receipt; exact retry replays the original IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyObservationCommit"
        "400": *a1
        "401": *a2
        "409": *a3
        "500": *a4
        "503": *a5
    get:
      operationId: listBodyObservationRecords
      summary: Read current source-available user reports from one BodyState revision.
      description: This new user-report ledger is not the legacy medical observation table; absence of reports never implies clinical normality. Device/document candidates are not admitted here.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: before_revision
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: At most 20 source-backed direct reports with a revision cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyObservationRecordPage"
        "400": *a1
        "401": *a2
        "500": *a4
        "503": *a5
  /api/v1/body-state/observation-records/{id}/correct:
    post:
      operationId: correctBodyObservationRecord
      summary: Explicitly correct exactly one current user-reported observation, preserving its old source and identity.
      description: Authenticated direct-user correction. Stores a new original self-report and links back to the superseded record; rejects identical replacements, stale revisions and clinical/device attribution.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectBodyObservationRequest"
      responses:
        "200":
          description: Durable amendment receipt. This does not represent a new health event or a verified clinical value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyObservationCommit"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/observation-records/{id}/withdraw:
    post:
      operationId: withdrawBodyObservationRecord
      summary: Withdraw one exact user-reported observation assertion without erasing original source history.
      description: Explicit authenticated user withdrawal removes the assertion from current source-backed reads, preserving historical audit and independently authorized source erasure semantics.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawBodyObservationRequest"
      responses:
        "200":
          description: One durable withdrawal receipt; exact-key replay returns its original identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyObservationCommit"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/hypothesis-records:
    post:
      operationId: recordBodyHypothesis
      summary: Record the authenticated user's own guess about a cause or possible condition.
      description: Direct user edit only. A BodyHypothesis carries no confidence, clinical status or AI provenance; Agent/Diagnosis hypotheses never enter this ledger. Owner, source and revision are assigned server-side. Related facts and observations must be the owner's own current asserted BodyFacts / BodyObservations (foreign or non-current ids are 404 HYPOTHESIS_FACT_NOT_FOUND / HYPOTHESIS_OBSERVATION_NOT_FOUND, checked before the revision). Exact retry with the same idempotency key replays the original receipt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBodyHypothesisRequest"
      responses:
        "200":
          description: Id-only durable receipt; the statement is never echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyHypothesisCommit"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
    get:
      operationId: listBodyHypothesisRecords
      summary: Read the user's current (asserted, source-available) hypotheses from one BodyState revision.
      description: Bounded to 100 newest-first records. related_fact_ids / related_observation_ids list only facts / observations that are still asserted. Withdrawn and superseded (corrected) hypotheses are excluded; a corrected hypothesis appears as its successor with the same lineage_id.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active user-authored hypotheses pinned to current_revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyHypothesisRecordList"
        "401": *a2
        "500": *a4
        "503": *a5
  /api/v1/body-state/hypothesis-records/{id}/withdraw:
    post:
      operationId: withdrawBodyHypothesisRecord
      summary: Withdraw one of the user's own current hypotheses without erasing its history or touching linked facts.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawBodyHypothesisRequest"
      responses:
        "200":
          description: One durable withdrawal receipt; exact-key replay returns its original identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyHypothesisCommit"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/hypothesis-records/{id}/correct:
    post:
      operationId: correctBodyHypothesisRecord
      summary: Correct one of the user's own current hypotheses, keeping the original as superseded history.
      description: Direct user edit only. The target becomes superseded (row, source and links preserved) and a new hypothesis with supersedes_hypothesis_id = target and the same lineage_id carries the complete replacement (statement plus explicit, possibly empty, fact/observation link lists). One BodyState revision (hypothesis.corrected), id-only outbox body_state.hypothesis_corrected and receipt. Identical replacements are 400; a withdrawn or already corrected target is 409 HYPOTHESIS_NOT_CURRENT. Linked facts/observations are never modified.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectBodyHypothesisRequest"
      responses:
        "200":
          description: Durable correction receipt; hypothesis_id is the new successor, target_hypothesis_id the superseded hypothesis. Exact-key replay returns the original receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyHypothesisCommit"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/concern-groups:
    get:
      operationId: listDerivedConcernGroups
      summary: Read the derived, non-authoritative ConcernGroup organisation of one BodyState revision.
      description: "Computed on read, never stored. Hypothesis–fact, hypothesis–observation and episode–fact links form an undirected graph; every connected component containing at least one hypothesis or episode is one group. Group id (DC-032, rule concern-group-anchor-v2): UUIDv5 of the group's anchor, the anchor-eligible member (current hypothesis lineage or current episode; never a fact or observation) whose lineage began earliest. Stable across linking/unlinking/correcting/withdrawing facts and observations, correcting any hypothesis, recording newer hypotheses, merges (earlier anchor wins) and splits (the part keeping the anchor keeps the id); it changes only when the anchor lineage leaves the group. Still a derived display id: never a foreign key or a clinical conclusion."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deterministically ordered derived groups for current_revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivedConcernGroupList"
        "401": *a2
        "500": *a4
        "503": *a5
  /api/v1/body-state/episodes:
    post:
      operationId: createBodyEpisode
      summary: Explicit user command creating an organizational Episode from an already-asserted positive symptom Fact.
      description: Uses only a server-verified existing self-reported symptom and its available source. Never accepts a title, inferred status, onset/resolution claim or AI authorization.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyEpisodeAssociationRequest"
      responses:
        "200":
          description: Atomic semantic revision and original durable receipt on exact replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyEpisodeCommandReceipt"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
    get:
      operationId: listBodyEpisodes
      summary: Read source-backed symptom Episode identities from one BodyState revision snapshot.
      description: Read-only. A clinical condition, inferred recovery or user-approved episode association cannot be created through this endpoint. Blocked or erased source-only identities are hidden, and negative symptoms do not imply an Episode ended.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: before_revision
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Whole-creation-revision page of source-visible Episode identities and evidence-backed states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyEpisodePage"
        "400": *a1
        "401": *a2
        "500": *a4
        "503": *a5
  /api/v1/body-state/episodes/{id}:
    get:
      operationId: getBodyEpisode
      summary: Read one source-visible Episode without exposing any other owner's identity.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evidence-scoped Episode detail, or not found if its original source is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyEpisodeRecord"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "500": *a4
        "503": *a5
  /api/v1/body-state/episodes/{id}/facts:
    post:
      operationId: linkBodyEpisodeFact
      summary: Explicitly associate one compatible symptom Fact to the specified current Episode.
      description: Creates only an observation link after owner, availability, type, side, region, revision and unique-primary checks. No implicit disease state, resolution, merge, split or recurrence.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyEpisodeAssociationRequest"
      responses:
        "200":
          description: Committed source association; exact retry returns original IDs and revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyEpisodeCommandReceipt"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/episodes/{id}/status:
    post:
      operationId: admitBodyEpisodeStatus
      summary: User-authorized explicit symptom course evidence from one already-linked Fact.
      description: The exact self-reported symptom Fact must still have an available original source and contain a typed explicit course report consistent with user-reported presence. Ordinary absence and unknown times do not automatically imply recovery. This command admits evidence, not an inferred medical diagnosis or guaranteed status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyEpisodeAssociationRequest"
      responses:
        "200":
          description: Evidence committed; reread projection, which may remain unknown if times conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyEpisodeCommandReceipt"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/episodes/{id}/recurrences:
    post:
      operationId: reportBodyEpisodeRecurrence
      summary: Direct user report that a distinct new Episode recurred after a source-backed completed Episode.
      description: Requires original completed Episode and a distinct currently source-visible new Episode with exact primary user-authored positive symptom Fact; creates an organizational relation only, never clinical etiology or old Episode reopening.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyEpisodeRecurrenceRequest"
      responses:
        "200":
          description: Durable and exactly replayable source-authorized historical relation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyEpisodeRecurrenceReceipt"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a3
        "500": *a4
        "503": *a5
  /api/v1/body-state/episodes/{id}/relations:
    get:
      operationId: listBodyEpisodeRelations
      summary: Source-visible authorized recurrence links touching one Episode at a stable BodyState revision.
      description: Hide relations with blocked or withdrawn new basis Fact, and mark the old course needs_review if its explicit ending evidence was invalidated. This read never implies shared clinical cause.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: before_revision
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Revision-scoped, minimally sourced relation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyEpisodeRelationPage"
        "400": *a1
        "401": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "500": *a4
        "503": *a5
  /api/v1/health-workspace:
    get:
      operationId: getHealthWorkspace
      summary: Get the current longitudinal health workspace projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current workspace projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthWorkspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/body-state/safety/restrictions:
    get:
      operationId: listSafetyRestrictions
      summary: Read all owner restrictions and source-validated clearance audit.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Native restrictions at one BodyState revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyRestrictionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ValidationUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/body-state/safety/restrictions/{id}/resolve:
    post:
      operationId: resolveSafetyRestriction
      summary: Submit exact-target user-reported professional clearance.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveSafetyRestrictionRequest"
      responses:
        "200":
          description: Immutable exact-target resolution receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyResolution"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "503":
          $ref: "#/components/responses/ValidationUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/lifestyle:
    get:
      operationId: getLifestyle
      summary: Get the current lifestyle projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifestyleSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateLifestyle
      summary: Patch the current lifestyle projection with optimistic concurrency.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifestyleSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLifestyleRequest'
  /api/v1/body-metrics:
    get:
      operationId: getBodyMetrics
      summary: Get current anthropometric measurements.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateBodyMetrics
      summary: Update current anthropometric measurements with optimistic concurrency.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricsSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBodyMetricsRequest'
  /api/v1/health-history/injury:
    get:
      operationId: getInjuryHistory
      summary: Get the current injury-history projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjuryHistorySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateInjuryHistory
      summary: Update injury-history summary with optimistic concurrency.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjuryHistorySnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInjuryHistoryRequest'
  /api/v1/onboarding/context:
    put:
      operationId: submitOnboardingContext
      summary: Atomically establish stable profile identity and the initial BodyState context.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingContextResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingContextRequest'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user identity.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Authenticated user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile:
    get:
      operationId: getUserProfile
      summary: Get stable user identity profile.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Profile, or null before onboarding/profile creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableUserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateUserProfile
      summary: Replace the editable stable identity fields.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':

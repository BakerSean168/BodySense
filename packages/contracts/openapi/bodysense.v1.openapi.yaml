          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        restriction_version:
          type: integer
          format: int64
          minimum: 1
        check_interaction_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        source_message_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        source_version:
          type: integer
          format: int64
          enum: [0, 1]
        basis_kind:
          type: string
          enum: [expiry, user_reverification, professional_clearance]

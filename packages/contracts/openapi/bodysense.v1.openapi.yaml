        id: {type: string, format: uuid}
        file_type:
          type: string
          enum: [consultation_photo, photo_front, photo_side, photo_back, report]
        original_name: {type: string}
        file_size: {type: integer, format: int64, minimum: 0}
        mime_type: {type: string}
        ocr_result:
          $ref: '#/components/schemas/JsonObject'
        ocr_status: {type: string, enum: [pending, processing, completed, failed]}
        analysis_result:
          $ref: '#/components/schemas/JsonObject'
        analysis_status: {type: string, enum: [none, pending, processing, completed, failed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UploadListResponse:
      type: object
      additionalProperties: false
      required: [uploads]
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/UserUpload'
    AssetSourceRemovalResponse:
      type: object
      additionalProperties: false
      required: [availability, message]
      properties:
        availability:
          type: string
          enum: [source_removed, erased]
          description: The asset's resulting file availability. Successful commands verify all known source replicas are absent. source_removed retains derived evidence; erased preserves the existing erasure lifecycle state. This is not an all-controlled-copy erasure receipt.
        source_removed_at:
          type: string
          format: date-time
          description: When source availability was revoked; physical cleanup may require retries. Present when availability is source_removed.
        message: {type: string}
    PostureAnalysisView:
      type: object
      additionalProperties: false
      required: [upload_id, view, file_type, analysis_status, analysis, created_at]
      properties:
        upload_id: {type: string, format: uuid}
        view: {type: string}
        file_type: {type: string}
        analysis_status: {type: string}
        analysis:
          $ref: '#/components/schemas/JsonObject'
        created_at: {type: string, format: date-time}
    PostureAnalysisSummary:
      type: object
      additionalProperties: false
      required: [has_analysis, views, findings, summaries]
      properties:
        has_analysis: {type: boolean}
        views:
          type: array
          items:
            $ref: '#/components/schemas/PostureAnalysisView'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/JsonValue'
        summaries:
          type: array
          items: {type: string}
    DocumentIndicatorSourceRegion:
      type: object
      additionalProperties: false
      required: [source_ref]
      properties:
        source_ref: {type: string}
        page_number: {type: integer}
        bbox:
          type: array
          items: {type: number}
    DocumentIndicatorEvidenceAdmissibility:
      type: object
      additionalProperties: false
      required: [status, policy_revision]
      properties:
        status: {type: string, enum: [admissible, needs_review, rejected]}
        policy_revision: {type: string}
        reason_codes:
          type: array
          items: {type: string}
    DocumentIndicatorCandidate:
      type: object
      additionalProperties: false
      required: [indicator_index, indicator_id, name, evidence_admissibility]
      properties:
        indicator_index: {type: integer, minimum: 0}
        indicator_id: {type: string}
        name: {type: string}
        value:
          $ref: '#/components/schemas/JsonValue'
        unit: {type: string}
        reference_range: {type: string}
        evidence_admissibility:
          $ref: '#/components/schemas/DocumentIndicatorEvidenceAdmissibility'
        source_refs:
          type: array
          items: {type: string}
        source_regions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentIndicatorSourceRegion'
    DocumentIndicatorReviewRecord:
      type: object
      additionalProperties: false
      required: [id, extraction_run_id, upload_id, indicator_index, indicator_id, action, created_at, idempotency_key]
      properties:
        id: {type: string, format: uuid}
        extraction_run_id: {type: string, format: uuid}
        upload_id: {type: string, format: uuid}
        indicator_index: {type: integer, minimum: 0}
        indicator_id: {type: string}
        action: {type: string, enum: [confirm, correct, reject]}
        reviewed_payload:
          $ref: '#/components/schemas/JsonObject'
        note: {type: string}
        created_at: {type: string, format: date-time}
        idempotency_key: {type: string, minLength: 1}
    DocumentIndicatorReviewProjection:
      type: object
      additionalProperties: false
      required: [indicator_index, indicator_id, candidate]
      properties:
        indicator_index: {type: integer, minimum: 0}
        indicator_id: {type: string}
        candidate:
          $ref: '#/components/schemas/DocumentIndicatorCandidate'
        effective_review:
          $ref: '#/components/schemas/DocumentIndicatorReviewRecord'
        history:
          type: array
          items:
            $ref: '#/components/schemas/DocumentIndicatorReviewRecord'
    HealthDocumentReviewContext:
      type: object
      additionalProperties: false
      required: [extraction_run_id, upload_id, source_availability, review_candidates]
      properties:
        extraction_run_id: {type: string, format: uuid}
        upload_id: {type: string, format: uuid}
        source_availability:
          type: string
          enum: [available, source_unavailable, erased]
          description: >
            CD-D4 source availability of the backing user asset. Historical
            admission stays readable after the original was removed, but the
            evidence is marked source_unavailable and never presented as a
            currently verifiable original.
        review_candidates:
          type: array
          items:
            $ref: '#/components/schemas/DocumentIndicatorReviewProjection'
    HealthDocumentReviewListResponse:
      type: object
      additionalProperties: false
      required: [review_candidates]
      properties:
        review_candidates:
          type: array
          items:
            $ref: '#/components/schemas/DocumentIndicatorReviewProjection'
    AppendHealthDocumentReviewRequest:
      type: object
      additionalProperties: false
      required: [indicator_index, indicator_id, action, source_refs, idempotency_key]
      properties:
        indicator_index: {type: integer, minimum: 0}
        indicator_id: {type: string, minLength: 1}
        action: {type: string, enum: [confirm, correct, reject]}
        reviewed_payload:
          $ref: '#/components/schemas/JsonObject'
        source_refs:
          type: array
          items: {type: string}
        idempotency_key: {type: string, minLength: 1}
        note: {type: string}
    RegisterKnowledgeSourceRequest:
      type: object
      additionalProperties: false
      required: [source_key, source_type, title, author, problem_slug, problem_display_name, original_file_path, license_status, content_hash, provenance]
      properties:
        source_key: {type: string, minLength: 1, maxLength: 200}
        source_type: {type: string, minLength: 1, maxLength: 50}
        title: {type: string, minLength: 1, maxLength: 500}
        author: {type: string, minLength: 1, maxLength: 255}
        problem_slug: {type: string, minLength: 1, maxLength: 100}
        problem_display_name: {type: string, minLength: 1, maxLength: 255}
        original_file_path: {type: string, minLength: 1}
        language: {type: string, minLength: 2, maxLength: 20, default: zh}
        license_status:
          type: string
          enum: [verified_reuse, citation_only, owned, public_domain]
        content_hash:
          type: string
          pattern: '^[0-9A-Fa-f]{64}$'
        canonical_url: {type: string, format: uri}
        source_version: {type: string, maxLength: 100, default: v1}
        provenance:
          $ref: '#/components/schemas/JsonObject'
        metadata:
          $ref: '#/components/schemas/JsonObject'
    KnowledgeSource:
      type: object
      additionalProperties: false
      required: [id, source_key, source_type, title, author, problem_slug, problem_display_name, original_file_path, language, ingest_status, metadata, license_status, content_hash, source_version, provenance, registered_at, created_at, updated_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        source_key: {type: string}
        source_type: {type: string}
        title: {type: string}
        author: {type: string}
        problem_slug: {type: string}
        problem_display_name: {type: string}
        original_file_path: {type: string}
        language: {type: string}
        ingest_status: {type: string}
        metadata:
          $ref: '#/components/schemas/JsonObject'
        license_status: {type: string}
        content_hash: {type: string}
        canonical_url: {type: string, format: uri}
        source_version: {type: string}
        provenance:
          $ref: '#/components/schemas/JsonObject'
        registered_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    KnowledgeSourceListResponse:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
    KnowledgeVideoIngestionRequest:
      type: object
      additionalProperties: false
      required: [source_key]
      properties:
        source_key: {type: string, minLength: 1, maxLength: 200}
        video_path: {type: string, minLength: 1}
        transcript_provider: {type: string, minLength: 1, maxLength: 100}
        transcript_model: {type: string, maxLength: 200}
        whisper_model: {type: string, minLength: 1, maxLength: 100}
        force_transcribe: {type: boolean, default: false}
        export_clips: {type: boolean, default: true}
        splitter_provider: {type: string, enum: [heuristic, llm], default: heuristic}
        ai_refine: {type: boolean, default: false}
    KnowledgeIngestionJob:
      type: object
      additionalProperties: false
      required: [id, job_type, status, attempts, max_attempts, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        job_type: {type: string}
        status: {type: string}
        progress:
          $ref: '#/components/schemas/JsonObject'
        result:
          $ref: '#/components/schemas/JsonObject'
        error:
          $ref: '#/components/schemas/JsonObject'
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    KnowledgeIngestionEnqueueResponse:
      type: object
      additionalProperties: false
      required: [job, idempotent_hit]
      properties:
        job:
          $ref: '#/components/schemas/KnowledgeIngestionJob'
        idempotent_hit: {type: boolean}
    KnowledgeSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1}
        top_k: {type: integer, minimum: 1, maximum: 20, default: 5}
        problem_slug: {type: string}
        unit_type: {type: string}
    KnowledgeSearchClip:
      type: object
      additionalProperties: false
      required: [id, clip_key, clip_type, title, source_timestamp]
      properties:
        id: {type: integer, format: int64}
        clip_key: {type: string}
        clip_type: {type: string}
        title: {type: string}
        source_timestamp: {type: string}
    KnowledgeSearchResult:
      type: object
      additionalProperties: false
      required: [id, problem_slug, category, unit_type, title, summary, body_markdown, similarity, source_title, source_author, source_timestamp, tags, clips]
      properties:
        id: {type: integer, format: int64}
        problem_slug: {type: string}
        category: {type: string}
        unit_type: {type: string}
        title: {type: string}
        summary: {type: string}
        body_markdown: {type: string}
        similarity: {type: number}
        source_title: {type: string}
        source_author: {type: string}
        source_timestamp: {type: string}
        tags:
          type: array
          items: {type: string}
        clips:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSearchClip'
    KnowledgeSearchResponse:
      type: object
      additionalProperties: false
      required: [results, total]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSearchResult'
        total: {type: integer, minimum: 0}
    KnowledgeStats:
      type: object
      additionalProperties: false
      required: [knowledge_sources, knowledge_segments, knowledge_units, knowledge_clips]
      properties:
        knowledge_sources: {type: integer, minimum: 0}
        knowledge_segments: {type: integer, minimum: 0}
        knowledge_units: {type: integer, minimum: 0}
        knowledge_clips: {type: integer, minimum: 0}
  responses:
    InvalidRequest:
      description: Request body or BodyState fact is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Referenced BodyState item does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RevisionConflict:
      description: expected_revision does not match current BodyState revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationUnavailable:
      description: Canonical body-region validation dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Requested operation conflicts with the durable resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Request origin or operator permission requirement was not satisfied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Too many authentication attempts; retry after the advertised delay.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: Upstream generated output failed the trusted application contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Required application capability is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ReplayUnavailable:
      description: Historical run lacks immutable provenance required for replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

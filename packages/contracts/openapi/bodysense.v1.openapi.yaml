          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listKnowledgeSources
      summary: List governed Knowledge source identities as a Knowledge operator.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Registered Knowledge sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/knowledge/ingestions/video:
    post:
      operationId: enqueueKnowledgeVideoIngestion
      summary: Enqueue one governed video ingestion using server-pinned Agent configurations.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeVideoIngestionRequest'
      responses:
        '202':
          description: Durable ingestion job accepted or idempotently recovered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeIngestionEnqueueResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/knowledge/ingestions/{jobID}:
    get:
      operationId: getKnowledgeIngestionJob
      summary: Read one durable Knowledge ingestion lifecycle as a Knowledge operator.
      security:
      - bearerAuth: []
      parameters:
      - name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Public ingestion lifecycle projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeIngestionJob'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/knowledge/search:
    post:
      operationId: searchKnowledge
      summary: Search normalized Knowledge as a Knowledge operator.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSearchRequest'
      responses:
        '200':
          description: Normalized Knowledge search results without private filesystem paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Internal Knowledge search service is unavailable or violates its contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/knowledge/stats:
    get:
      operationId: getKnowledgeStats
      summary: Read normalized Knowledge library statistics as a Knowledge operator.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Knowledge library statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Internal Knowledge statistics service is unavailable or violates its contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/body-state/records/{id}/correct:
    post:
      operationId: correctBodyFactRecord
      summary: Correct one explicit user assertion while retaining its original provenance.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectBodyFactRecordRequest"
      responses:
        "200":
          description: An actual atomic amendment receipt. Withdrawal does not erase historical evidence or resolve symptoms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyFactCommit"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ValidationUnavailable"
  /api/v1/body-state/records/{id}/withdraw:
    post:
      operationId: withdrawBodyFactRecord
      summary: Withdraw one user assertion without claiming privacy erasure or symptom resolution.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawBodyFactRecordRequest"
      responses:
        "200":
          description: An actual atomic amendment receipt. Withdrawal does not erase historical evidence or resolve symptoms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyFactCommit"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ValidationUnavailable"
components:
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultationRunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InteractionId:
      name: interactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiagnosisAnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TreatmentRevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanRevisionId:
      name: revisionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanProposalId:
      name: proposalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TrainingPlanId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssessmentReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    NoStore:
      description: Credential-bearing responses must not be cached.
      schema:
        type: string
        const: no-store
    NoCachePragma:
      description: HTTP Pragma no-cache directive for credential-bearing responses.
      schema:
        type: string
        const: no-cache
    RefreshCookie:
      description: HttpOnly refresh credential cookie (set or cleared).
      schema:
        type: string
    RetryAfter:
      description: Seconds until the next authentication attempt may be retried.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BodyFactTemporal:
      type: object
      additionalProperties: false
      required:
        - precision
      properties:
        precision:
          type: string
          enum:
            - exact
            - day
            - range
            - approximate
            - unknown
        start:
          type: string
          maxLength: 64
        end:
          type: string
          maxLength: 64
        original_expression:
          type: string
          maxLength: 500
        timezone:
          type: string
          maxLength: 128
    BodyFactSeverity:
      type: object
      additionalProperties: false
      required:
        - raw_value
      properties:
        raw_value:
          type: string
          minLength: 1
          maxLength: 100
        scale:
          type: string
          maxLength: 100
        unit:
          type: string
          maxLength: 100
    BodyFactSymptomDetails:
      type: object
      additionalProperties: false
      required: []
      properties:
        symptom_type:
          type: string
          maxLength: 200
        presence:
          type: string
          enum:
            - present
            - absent
        laterality:
          type: string
          enum:
            - left
            - right
            - bilateral
            - not_applicable
            - unknown
        severity:
          $ref: "#/components/schemas/BodyFactSeverity"
        pattern:
          type: string
          enum:
            - continuous
            - intermittent
            - unknown
        triggers: &a1
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 300
        relieving_factors: *a1
        occurrence_context:
          type: string
          maxLength: 500
        episode_course_report:
          type: string
          description: Explicit user-authored report about this symptom course. Not inferred from a generic present/absent statement; admitted separately by a user-authorized Episode command.
          enum:
            - explicit_current_report
            - explicit_resolution
    BodyFactHealthHistoryDetails:
      type: object
      additionalProperties: false
      required: []
      properties:
        history_kind:
          type: string
          maxLength: 200
        event_description:
          type: string
          maxLength: 500
        outcome:
          type: string
          maxLength: 500
        source_context:
          type: string
          maxLength: 500
    BodyFactActivityDetails:
      type: object
      additionalProperties: false
      required: []
      properties:
        activity_type:
          type: string
          maxLength: 200
        duration:
          type: string
          maxLength: 200
        volume:
          type: string
          maxLength: 200
        intensity:
          type: string
          maxLength: 200
    BodyFactLifestyleDetails:
      type: object
      additionalProperties: false
      required: []
      properties:
        habit_type:
          type: string
          maxLength: 200
        frequency:
          type: string
          maxLength: 200
        pattern:
          type: string
          maxLength: 200
        typical_duration:
          type: string
          maxLength: 200
    BodyFactTrainingFeedbackDetails:
      type: object
      additionalProperties: false
      required: []
      properties:
        feedback_kind:
          type: string
          maxLength: 200
    RecordSymptomFactInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - statement
        - body_region_ids
        - temporal
        - details
      properties:
        kind: &a2
          type: string
          enum:
            - symptom
        statement: &a3
          type: string
          minLength: 1
          maxLength: 2000
        body_region_ids: &a4
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
        temporal: &a5
          $ref: "#/components/schemas/BodyFactTemporal"
        details: &a6
          $ref: "#/components/schemas/BodyFactSymptomDetails"
    SymptomBodyFactRecord:
      type: object
      additionalProperties: false
      required:
        - kind
        - statement
        - body_region_ids
        - temporal
        - details
        - id
        - user_id
        - subject
        - source_evidence_id
        - assertion_status
        - created_revision
        - recorded_at
      properties:
        kind: *a2
        statement: *a3
        body_region_ids: *a4
        temporal: *a5
        details: *a6
        id: &a7
          type: string
          format: uuid
        user_id: *a7
        subject:
          type: string
          enum:
            - self
        source_evidence_id: *a7
        assertion_status:
          type: string
          enum:
            - asserted
            - superseded
            - withdrawn
        created_revision:
          type: integer
          format: int64
          minimum: 1
        recorded_at:
          type: string
          format: date-time
        supersedes_fact_id:
          type: string
          format: uuid
          description: Previous assertion replaced by an explicit correction; not a symptom recurrence or privacy erasure.
    RecordHealthHistoryFactInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - statement
        - body_region_ids
        - temporal
        - details
      properties:
        kind: &a8
          type: string
          enum:
            - health_history
        statement: &a9
          type: string

      additionalProperties: false
      required: [idempotency_key, expected_revision, expected_restriction_version, basis_kind]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        expected_restriction_version:
          type: integer
          format: int64
          minimum: 1
        basis_kind:
          type: string
          enum: [expiry, user_reverification, professional_clearance]
        source_message_id:
          type: string
          format: uuid
        source_version:
          type: integer
          format: int64
          enum: [0, 1]
        check_interaction_id:
          type: string
          format: uuid
        statement:
          type: string
          description: Exact Go declaration including every reviewed lift condition; arbitrary affirmative prose is rejected.
          minLength: 1
          maxLength: 12000

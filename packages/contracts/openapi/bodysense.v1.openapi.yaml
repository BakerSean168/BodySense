        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/treatments/revisions/{revisionId}:
    get:
      operationId: getTreatmentRevision
      summary: Get one immutable Treatment revision.

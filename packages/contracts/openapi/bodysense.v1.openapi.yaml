      summary: Get one owned TrainingPlan proposal; another owner's id is not found.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PlanProposalId'}]
      responses:
        '200': {description: Owned proposal, content: {application/json: {schema: {$ref: '#/components/schemas/PlanProposalRecord'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/plan-proposals/{proposalId}/accept:
    post:
      operationId: acceptPlanProposal
      summary: Accept one pending proposal as the authenticated user's explicit decision.
      description: Under the owner lock, rechecks fingerprint, base revision, 7-day TTL and current BodyState/Diagnosis/Safety context, then writes one immutable revision and receipt. Saving does not authorize execution; the returned gate is a current projection.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PlanProposalId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlanDecisionRequest'}}}
      responses:
        '200': {description: Acceptance receipt, content: {application/json: {schema: {$ref: '#/components/schemas/PlanAcceptanceReceipt'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ValidationUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/plan-proposals/{proposalId}/reject:
    post:
      operationId: rejectPlanProposal
      summary: Reject one pending proposal as the authenticated user's explicit decision; no plan changes.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PlanProposalId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlanDecisionRequest'}}}
      responses:
        '200': {description: Rejection receipt, content: {application/json: {schema: {$ref: '#/components/schemas/PlanRejectionReceipt'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/assets/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: deleteAsset
      summary: Remove the private source of one owned asset (source removal, not erasure).
      description: >
        PC-D7 source removal: the private original object is deleted and the
        asset becomes source_removed. Adopted evidence history, derived run
        audit rows and review records are retained and stay readable with a
        source-unavailable marker. This is not a health-data erasure request
        and never revokes historical admission. Repeating the command is
        idempotent. Foreign or missing assets return owner-masked 404.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Asset source removed (or already removed; idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSourceRemovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads:
    post:
      operationId: createUpload
      summary: Upload one private health document or posture image for authenticated processing.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload manifest created after the private object is durably stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpload'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listUploads
      summary: List private upload manifests owned by the authenticated user.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Owned upload manifests ordered by repository policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/posture-analysis:
    get:
      operationId: getPostureAnalysis
      summary: Read the latest completed posture-analysis projection for the authenticated user.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Latest completed per-view posture analyses, or an empty summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureAnalysisSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getUpload
      summary: Get one private upload manifest owned by the authenticated user.
      description: Foreign and missing uploads are indistinguishable (owner-masked 404).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Owned upload manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpload'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteUpload
      summary: Remove the private source of one owned upload (source removal, not erasure).
      description: >
        Legacy upload-surface alias of the source-removal command
        (PC-D7): deletes the private original object and marks the backing
        asset source_removed while retaining adopted evidence history.
        Idempotent; foreign or missing uploads return owner-masked 404.
        Success requires verified absence of every known source replica; cleanup
        failures return an error and retain retry state. This is not a receipt
        for AS-002 erasure of all controlled data.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Upload source removed (or already removed; idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSourceRemovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/{id}/health-document-review:
    get:
      operationId: getHealthDocumentReviewContext
      summary: Resolve the current server-owned health-document extraction run and its review projection.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current review context for the owned upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDocumentReviewContext'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/{id}/extractions/{runId}/reviews:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listHealthDocumentReviewCandidates
      summary: List append-only review state for one exact owned extraction run.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Review candidates and their current/history projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDocumentReviewListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: appendHealthDocumentReview
      summary: Append one idempotent confirm, correct or reject action to an exact owned extraction candidate.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendHealthDocumentReviewRequest'
      responses:
        '201':
          description: Immutable review record appended or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIndicatorReviewRecord'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/uploads/{id}/extractions/{runId}/source:
    get:
      operationId: getHealthDocumentSource
      summary: Stream the authenticated private source document for one exact owned extraction run.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Private upload bytes. The server preserves the stored MIME type and adds nosniff.
          content:
            application/pdf:
              schema: &privateUploadBinary
                type: string
                format: binary
            image/jpeg:
              schema: *privateUploadBinary
            image/png:
              schema: *privateUploadBinary
            image/webp:
              schema: *privateUploadBinary
            application/octet-stream:
              schema: *privateUploadBinary
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/knowledge/sources:
    post:
      operationId: registerKnowledgeSource
      summary: Register one governed Knowledge source identity as a Knowledge operator.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterKnowledgeSourceRequest'

      operationId: getHealthDocumentReviewContext
      summary: Resolve the current server-owned health-document extraction run and its review projection.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current review context for the owned upload.

          type: integer
          format: int64
          minimum: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          description: End of validity for on_expiry; only a review point for other lift policies.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'

        '200':
          description: Knowledge library statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Internal Knowledge statistics service is unavailable or violates its contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultationRunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InteractionId:
      name: interactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiagnosisAnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TreatmentRevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingPlanId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssessmentReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    NoStore:
      description: Credential-bearing responses must not be cached.
      schema:
        type: string
        const: no-store
    NoCachePragma:
      description: Legacy no-cache directive for credential-bearing responses.
      schema:
        type: string
        const: no-cache
    RefreshCookie:
      description: HttpOnly refresh credential cookie (set or cleared).
      schema:
        type: string
    RetryAfter:
      description: Seconds until the next authentication attempt may be retried.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AssessmentEvidenceSource:
      type: string
      enum: [body_state, report, posture_analysis]
    AuthRegisterRequest:
      type: object

openapi: 3.1.0
info:
  title: BodySense Public API
  version: 1.0.0-vnext
  license:
    name: MIT
    identifier: MIT
  description: Canonical browser-facing REST contract for BodySense vNext. During Phase 02 endpoints are added only when their
    production handler is migrated behind the generated boundary; undocumented legacy routes remain temporary debt until this
    specification reaches complete public-route coverage.
servers:
- url: /
paths:
  /api/v1/body-state/facts:
    post:
      operationId: addBodyStateFact
      summary: Add a durable BodyState fact with optimistic revision checking.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBodyStateFactRequest'
      responses:
        '200':
          description: Fact and immutable revision created by the mutation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health-workspace:
    get:
      operationId: getHealthWorkspace
      summary: Get the current longitudinal health workspace projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current workspace projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthWorkspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/body-state:
    get:
      operationId: getBodyState
      summary: Get the current durable BodyState snapshot.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/body-state/facts/{id}/correct:
    post:
      operationId: correctBodyStateFact
      summary: Correct a fact that was previously wrong.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectBodyStateFactRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /api/v1/body-state/facts/{id}/temporal:
    patch:
      operationId: updateBodyStateFactTemporal
      summary: Update temporal state for a previously true fact.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBodyStateFactTemporalRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/facts/{id}/review:
    patch:
      operationId: reviewBodyStateFact
      summary: Review a BodyState fact.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateFactMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBodyStateFactRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/observations:
    post:
      operationId: addBodyStateObservation
      summary: Add a durable BodyState observation.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateObservationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyStateObservationInput'
  /api/v1/body-state/observations/{id}/review:
    patch:
      operationId: reviewBodyStateObservation
      summary: Review a BodyState observation.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateObservationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBodyStateObservationRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/hypotheses:
    post:
      operationId: addBodyStateHypothesis
      summary: Add a BodyState hypothesis.
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateHypothesisMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyStateHypothesisInput'
  /api/v1/body-state/hypotheses/{id}/lifecycle:
    patch:
      operationId: updateBodyStateHypothesisLifecycle
      summary: Update hypothesis lifecycle/counterevidence.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateHypothesisMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBodyStateHypothesisLifecycleRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v1/body-state/evidence:
    get:
      operationId: listBodyStateEvidence
      summary: List durable evidence references used by BodyState reasoning.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateEvidenceListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/body-state/safety/resolve:
    post:
      operationId: resolveBodyStateSafety
      summary: Resolve or monitor the durable safety projection.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful BodyState operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyStateRevisionMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '503':
          $ref: '#/components/responses/ValidationUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveBodyStateSafetyRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    BodyStateFactInput:
      type: object
      additionalProperties: false
      required:
      - kind
      - value
      properties:
        concern_key:
          type: string
        kind:
          type: string
          minLength: 1
        body_region:
          type: string
        body_region_id:
          type:
          - string
          - 'null'
        value:
          type: string
        details:
          $ref: '#/components/schemas/JsonObject'
        origin:
          type: string
        review_state:
          type: string
        lifecycle_state:
          type: string
        trend:
          type: string
        source_key:
          type: string
        provenance:
          $ref: '#/components/schemas/JsonObject'
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        valid_from:
          type:
          - string
          - 'null'
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
    UpsertBodyStateFactRequest:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - fact
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        fact:
          $ref: '#/components/schemas/BodyStateFactInput'
    BodyStateFact:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - kind
      - body_region_id
      - value
      - details
      - origin
      - review_state
      - lifecycle_state
      - trend
      - provenance
      - excluded_from_reasoning
      - created_revision
      - updated_revision
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        concern_key:
          type: string
        kind:
          type: string
        body_region:
          type: string
        body_region_id:
          type:
          - string
          - 'null'
        value:
          type: string
        details:
          $ref: '#/components/schemas/JsonObject'
        origin:
          type: string
        review_state:
          type: string
        lifecycle_state:
          type: string
        trend:
          type: string
        source_key:
          type: string
        provenance:
          $ref: '#/components/schemas/JsonObject'
        observed_at:
          type: string
          format: date-time
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        supersedes_fact_id:
          type: string
          format: uuid
        excluded_from_reasoning:
          type: boolean
        created_revision:
          type: integer
          format: int64
        updated_revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BodyStateRevision:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - revision
      - change_type
      - source
      - changes
      - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        change_type:
          type: string
        source:
          type: string
        changes:
          $ref: '#/components/schemas/JsonObject'
        created_at:
          type: string
          format: date-time
    BodyStateFactMutationResponse:
      type: object
      additionalProperties: false
      required:
      - fact
      - revision
      properties:
        fact:
          $ref: '#/components/schemas/BodyStateFact'
        revision: &id007
          anyOf:
          - $ref: '#/components/schemas/BodyStateRevision'
          - type: 'null'
    StringArray:
      type: array
      items:
        type: string
    BodyStateObservation:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - kind
      - body_region_id
      - value
      - condition
      - provenance
      - review_state
      - lifecycle_state
      - excluded_from_reasoning
      - created_revision
      - updated_revision
      - created_at
      - updated_at
      properties:
        id: &id002
          type: string
          format: uuid
        user_id: *id002
        concern_key: &id003
          type: string
        kind: *id003
        body_region: *id003
        body_region_id:
          type:
          - string
          - 'null'
        method: *id003
        value:
          $ref: '#/components/schemas/JsonObject'
        condition:
          $ref: '#/components/schemas/JsonObject'
        source_key: *id003
        provenance:
          $ref: '#/components/schemas/JsonObject'
        observed_at:
          type: string
          format: date-time
        supersedes_observation_id:
          type: string
          format: uuid
        review_state: *id003
        lifecycle_state: *id003
        excluded_from_reasoning: &id006
          type: boolean
        created_revision: &id004
          type: integer
        updated_revision: *id004
        created_at: &id005
          type: string
          format: date-time
        updated_at: *id005
    BodyStateHypothesis:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - concern_key
      - statement
      - lifecycle_state
      - supporting_fact_ids
      - supporting_observation_ids
      - supporting_evidence_ids
      - counterevidence_ids
      - provenance
      - created_revision
      - updated_revision
      - created_at
      - updated_at
      properties:
        id: *id002
        user_id: *id002
        concern_key: *id003
        statement: *id003
        lifecycle_state: *id003
        confidence:
          type: string
        supporting_fact_ids:
          $ref: '#/components/schemas/StringArray'
        supporting_observation_ids:
          $ref: '#/components/schemas/StringArray'
        supporting_evidence_ids:
          $ref: '#/components/schemas/StringArray'
        counterevidence_ids:
          $ref: '#/components/schemas/StringArray'
        source_analysis_id:
          type: string
          format: uuid
        provenance:
          $ref: '#/components/schemas/JsonObject'
        created_revision: *id004
        updated_revision: *id004
        created_at: *id005
        updated_at: *id005
    HealthWorkspaceBodyState:
      type: object
      additionalProperties: false
      required:
      - current_revision
      - safety_state
      - facts
      - pending_facts
      - observations
      - pending_observations
      - hypotheses
      - recent_revisions
      properties:
        current_revision: *id004
        safety_state:
          $ref: '#/components/schemas/JsonObject'
        facts:
          type: array
          items:
            $ref: '#/components/schemas/BodyStateFact'
        pending_facts:
          type: array
          items:
            $ref: '#/components/schemas/BodyStateFact'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/BodyStateObservation'
        pending_observations:
          type: array
          items:
            $ref: '#/components/schemas/BodyStateObservation'
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/BodyStateHypothesis'
        recent_revisions:
          type: array
          items:
            $ref: '#/components/schemas/BodyStateRevision'
    DiagnosisCandidate:
      type: object
      additionalProperties: false
      required:
      - candidate_id
      - name
      - confidence
      - basis
      - typical_symptoms
      - basis_fact_ids
      - basis_observation_ids
      - supporting_evidence_ids
      - counterevidence_ids
      - reasoning_summary
      - missing_information
      - safety_notes
      properties:
        candidate_id: *id002
        concern_key: *id003
        name: *id003
        confidence:
          type: string
          enum:
          - 高
          - 中
          - 低
        severity:
          type: string
          enum:
          - 轻度
          - 中度
          - 重度
        evidence_strength:
          type: string
          enum:
          - 高
          - 中
          - 低
        impact:
          type: string
        basis: *id003
        typical_symptoms: *id003
        differential:
          type: string
        basis_fact_ids:
          $ref: '#/components/schemas/StringArray'
        basis_observation_ids:
          $ref: '#/components/schemas/StringArray'
        supporting_evidence_ids:
          $ref: '#/components/schemas/StringArray'
        counterevidence_ids:
          $ref: '#/components/schemas/StringArray'
        reasoning_summary: *id003
        missing_information:
          $ref: '#/components/schemas/StringArray'
        safety_notes:
          $ref: '#/components/schemas/StringArray'
    DiagnosisCandidateAssessment:
      type: object
      additionalProperties: false
      required:
      - id
      - analysis_id
      - candidate_id
      - user_id
      - state
      - assessed_at
      properties:
        id: *id002
        analysis_id: *id002
        candidate_id: *id002
        user_id: *id002
        state:
          type: string
          enum:
          - confirmed
          - unsure
          - not_applicable
        assessed_at: *id005
    DiagnosisFreshness:
      type: object
      additionalProperties: false
      required:
      - analysis_id
      - user_id
      - state
      - evaluated_against_revision
      - reasons
      - checked_at
      properties:
        analysis_id: *id002
        user_id: *id002
        state:
          type: string
          enum:
          - fresh
          - potentially_stale
          - stale
        evaluated_against_revision: *id004
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisFreshnessReason'
        checked_at: *id005
    DiagnosisWorkspaceProjection:
      type: object
      additionalProperties: false
      required:
      - analysis_id
      - body_state_revision
      - status
      - scope
      - summary
      - candidates
      - cross_concern_patterns
      - information_gaps
      - safety_summary
      - citations
      - governance
      - agent_configuration_id
      - agent_configuration
      - decision_trace
      - execution_provenance
      - evidence_acquisition_trace
      - created_at
      - candidate_assessments
      - freshness
      properties:
        analysis_id: *id002
        body_state_revision: *id004
        status:
          type: string
          enum:
          - completed
          - partial
          - insufficient_information
          - safety_blocked
        scope: *id003
        summary: *id003
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisCandidate'
        cross_concern_patterns:
          $ref: '#/components/schemas/StringArray'
        information_gaps:
          $ref: '#/components/schemas/StringArray'
        safety_summary:
          $ref: '#/components/schemas/JsonObject'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        governance:
          $ref: '#/components/schemas/JsonObject'
        agent_configuration_id: *id003
        agent_configuration:
          $ref: '#/components/schemas/JsonObject'
        decision_trace:
          $ref: '#/components/schemas/JsonObject'
        execution_provenance:
          $ref: '#/components/schemas/JsonObject'
        evidence_acquisition_trace:
          $ref: '#/components/schemas/JsonObject'
        decision_authority:
          $ref: '#/components/schemas/JsonObject'
        created_at: *id005
        candidate_assessments:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisCandidateAssessment'
        freshness:
          $ref: '#/components/schemas/DiagnosisFreshness'
    TreatmentInterventionDraft:
      type: object
      additionalProperties: false
      required:
      - kind
      - title
      - description
      - prescription
      properties:
        kind: *id003
        title: *id003
        description: *id003
        prescription:
          $ref: '#/components/schemas/JsonObject'
    TreatmentPlanContent:
      type: object
      additionalProperties: false
      required:
      - summary
      - goal
      - duration_weeks
      - interventions
      - daily_habits
      - expected_timeline
      - warning_signs
      - review_triggers
      - safety_notes
      properties:
        summary: *id003
        goal: *id003
        duration_weeks: *id004
        interventions:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentInterventionDraft'
        daily_habits:
          $ref: '#/components/schemas/StringArray'
        expected_timeline: *id003
        warning_signs:
          $ref: '#/components/schemas/StringArray'
        review_triggers:
          $ref: '#/components/schemas/StringArray'
        safety_notes:
          $ref: '#/components/schemas/StringArray'
    Intervention:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - treatment_id
      - treatment_revision_id
      - kind
      - title
      - description
      - prescription
      - position
      - status
      - created_at
      - updated_at
      properties:
        id: *id002
        user_id: *id002
        treatment_id: *id002
